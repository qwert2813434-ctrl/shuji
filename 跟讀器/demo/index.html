<!doctype html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>沉思錄・示範・跟讀器</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="沉思錄・示範">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F0E12" id="tc">
<style>
:root{
  --bg:#0F0E12; --surface:#201D24; --accent:#FF4D85;
  --ink:#FFFFFF; --ink2:#B8B4BE; --faint:#7C7786; --line:#312D38;
  --lit:rgba(255,77,133,.13); --done:#5E5A68;
}
:root[data-theme="light"]{
  --bg:#F4F1E8; --surface:#FFFFFF; --accent:#3A5A8C;
  --ink:#26251F; --ink2:#6B6659; --faint:#9A9484; --line:#DAD5C6;
  --lit:rgba(58,90,140,.11); --done:#A9A498;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; padding:0; overflow-x:hidden}
body{
  background:var(--bg); color:var(--ink); font-weight:400;
  font-family:"Inter","PingFang TC","Noto Sans TC",-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(150px + env(safe-area-inset-bottom));
  padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right);
}

header{position:fixed; top:0; left:0; right:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--line);
       padding-top:env(safe-area-inset-top)}
.bar{max-width:760px; margin:0 auto; padding:15px 24px 0; display:flex; align-items:baseline; gap:14px}
.book{font-size:12px; font-weight:600; letter-spacing:.24em; color:var(--faint)}
.spacer{flex:1}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg a{font:inherit;font-size:11px;letter-spacing:.14em;color:var(--ink2);text-decoration:none;
 padding:6px 12px;white-space:nowrap;transition:background .2s,color .2s}
.seg a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.tbtn{background:none; border:1px solid var(--line); color:var(--ink2); cursor:pointer;
      font:inherit; font-size:11px; letter-spacing:.16em; padding:6px 12px; border-radius:6px}
nav{max-width:760px; margin:0 auto; padding:12px 24px 13px; display:flex; gap:6px;
    overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch}
nav::-webkit-scrollbar{display:none}
nav button{flex:none; background:none; border:1px solid var(--line); border-radius:7px;
  color:var(--ink2); font:inherit; font-size:13px; font-variant-numeric:tabular-nums;
  padding:7px 14px; cursor:pointer; white-space:nowrap}
nav button[aria-current="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
nav button:disabled{color:var(--done); opacity:.42; cursor:default}

main{max-width:760px; margin:0 auto; padding:42px 24px 0}
h1{font-size:44px; font-weight:700; letter-spacing:-.01em; line-height:1.15; margin:0 0 10px}
.sub{font-size:13px; color:var(--faint); margin:0 0 8px;
     display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.dl{background:none; border:1px solid var(--line); color:var(--ink2); cursor:pointer;
    font:inherit; font-size:11px; letter-spacing:.14em; padding:5px 11px; border-radius:6px;
    font-variant-numeric:tabular-nums}
.dl[data-s="done"]{border-color:var(--accent); color:var(--accent)}
.dl:disabled{opacity:.55; cursor:default}
.dl[hidden]{display:none}
.hint{font-size:13px; line-height:1.8; color:var(--ink2); margin:0 0 40px;
      padding-bottom:26px; border-bottom:1px solid var(--line)}

.pt{margin:0 0 34px; position:relative; padding-left:20px}
.pt::before{content:""; position:absolute; left:0; top:.45em; bottom:.2em; width:2px;
            background:var(--line); border-radius:2px; transition:background .25s}
.pt.on::before{background:var(--accent)}
.para{font-size:var(--fs,19px); line-height:2.15; margin:0; letter-spacing:.01em}
.para span{cursor:pointer; border-radius:4px; padding:1px 0; transition:background .18s,color .18s}
.para span.on{background:var(--lit); color:var(--ink)}
.para span em{font-style:normal; border-radius:3px; transition:background .15s,color .15s}
.para span em.now{background:var(--accent); color:var(--bg)}
.para i.n{font-style:normal; border-bottom:1px dotted var(--faint); cursor:pointer}
.pop{position:fixed; z-index:60; background:var(--surface); border:1px solid var(--line);
 border-radius:10px; padding:11px 14px; max-width:min(320px,86vw);
 box-shadow:0 12px 34px -14px rgba(0,0,0,.55); font-size:14px; line-height:1.6; display:none}
.pop b{display:block; font-size:14px; letter-spacing:.03em; color:var(--accent); margin-bottom:2px}
.pop .k{font-size:12px; color:var(--faint); font-family:ui-monospace,Menlo,monospace; margin-left:6px}
.pact{display:flex; gap:8px; margin-top:10px}
.pact button,.pact a{background:none; border:1px solid var(--line); border-radius:6px;
 color:var(--ink2); font:inherit; font-size:12px; letter-spacing:.08em; padding:5px 11px;
 cursor:pointer; text-decoration:none}
.pact button:hover,.pact a:hover{border-color:var(--accent); color:var(--accent)}
:root[data-theme="light"] .para span em.now{color:#fff}
nav button.done::after{content:""; display:inline-block; width:5px; height:5px;
  border-radius:50%; background:var(--accent); margin-left:7px; vertical-align:2px}
.para span.past{color:var(--ink2)}
.spin{width:100%; background:var(--surface); border:1px solid var(--line); border-radius:8px;
  color:var(--ink); font:inherit; font-size:15px; padding:11px 13px; margin:4px 0 12px}
.spnote{font-size:13px; line-height:1.95; color:var(--ink2); margin:0 0 18px}
.spnote b{color:var(--ink); font-weight:600}
.spst{font-size:13px; color:var(--faint); margin:16px 0 0; min-height:1.4em}
.spst.bad{color:var(--accent)}
/* 收合用高度不用 transform——Safari 對 sticky 元素套 transform 會讓吸頂失效，
   工具列一藏就再也回不來（實機 iPhone＋Mac 都中，Chrome 沒事所以測不到） */
header{transition:max-height .3s ease, padding-top .3s ease; overflow:hidden; max-height:240px}
header.hid{max-height:0; padding-top:0; border-bottom:0}
body{padding-top:var(--hh,105px)}
.peek{display:none; position:fixed; z-index:25; top:calc(10px + env(safe-area-inset-top));
  left:0; right:0; margin:0 auto; width:fit-content; background:var(--surface); color:var(--ink2);
  border:1px solid var(--line); border-radius:18px; padding:7px 16px; font:inherit;
  font-size:12px; letter-spacing:.14em; cursor:pointer;
  box-shadow:0 8px 22px -10px rgba(0,0,0,.5)}
header.hid + .peek{display:block}
@keyframes npfl{from{background:var(--accent); color:var(--bg)}to{background:none}}
.para span.fl{animation:npfl 1.4s ease-out}
.nit .go{background:none; border:0; color:var(--faint); font:inherit; font-size:12px;
  cursor:pointer; padding:5px 0; margin-right:18px}
.nit .go:active{color:var(--accent)}
.strow{display:flex; align-items:center; gap:14px; padding:2px 0 6px}
.strow input{flex:1; accent-color:var(--accent); height:5px; cursor:pointer}
.strow output{font-size:14px; color:var(--ink2); min-width:2em; text-align:right;
  font-variant-numeric:tabular-nums}


.ver{background:none; border:0; color:var(--faint); font:inherit; font-size:10px;
     letter-spacing:.1em; cursor:pointer; padding:6px 2px}
.ver:active{color:var(--accent)}
/* 畫過重點的句子：底線用 inset 陰影，才不會跟播放中的背景打架 */
.para span.hl{box-shadow:inset 0 -2px 0 var(--accent)}
/* 筆記區 */
.np{position:fixed; inset:0; z-index:80; background:var(--bg); display:flex; flex-direction:column;
    padding-top:env(safe-area-inset-top)}
.np[hidden]{display:none}
.nph{display:flex; align-items:center; gap:9px; padding:14px 20px; border-bottom:1px solid var(--line)}
.nph b{font-size:15px; font-weight:600} .nph .sp{flex:1}
.npb{flex:1; overflow-y:auto; width:100%; max-width:760px; margin:0 auto;
     padding:6px 20px calc(34px + env(safe-area-inset-bottom))}
.nch{font-size:11px; font-weight:600; letter-spacing:.2em; color:var(--faint); margin:24px 0 11px}
.nit{border-left:2px solid var(--accent); padding:2px 0 2px 14px; margin:0 0 18px}
.nit p{font-size:15px; line-height:1.95; margin:0 0 9px}
.nit textarea{width:100%; background:var(--surface); border:1px solid var(--line); border-radius:8px;
  color:var(--ink); font:inherit; font-size:14px; line-height:1.7; padding:9px 11px;
  resize:vertical; min-height:42px}
.nit .del{background:none; border:0; color:var(--faint); font:inherit; font-size:12px;
  cursor:pointer; padding:5px 0}
.nit .del:active{color:var(--accent)}
.npe{font-size:14px; color:var(--ink2); line-height:2; padding:34px 0}
.src{margin:12px 0 0}
.src summary{font-size:11px; font-weight:600; letter-spacing:.2em; color:var(--faint);
             cursor:pointer; list-style:none; padding:5px 0}
.src summary::-webkit-details-marker{display:none}
.src summary::before{content:"原文 "}
.src[open] summary::before{content:"收起 "}
.src div{font-size:15px; line-height:2.05; color:var(--ink2); margin-top:10px; padding-left:16px;
         border-left:1px solid var(--line); white-space:pre-wrap}
.empty{font-size:15px; line-height:1.9; color:var(--ink2); padding:20px 0 60px}

/* 播放列 */
.player{position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--surface);
  border-top:1px solid var(--line);
  padding:11px calc(20px + env(safe-area-inset-left)) calc(13px + env(safe-area-inset-bottom))
          calc(20px + env(safe-area-inset-right));}
.pin{max-width:760px; margin:0 auto; display:grid; gap:10px 15px;
     grid-template-columns:auto auto auto 1fr auto; align-items:center}
.seek{grid-column:1/-1; width:100%; accent-color:var(--accent); height:5px; cursor:pointer; margin:0}
.nb{width:36px; height:36px; flex:none; border-radius:50%; border:1px solid var(--line);
    background:none; color:var(--ink2); cursor:pointer; display:grid; place-items:center}
.nb:disabled{opacity:.3; cursor:default}
.play{width:48px; height:48px; border-radius:50%; border:none; background:var(--ink);
      color:var(--bg); cursor:pointer; display:grid; place-items:center}
.nb svg,.play svg{width:16px; height:16px; fill:currentColor}
.play svg{width:18px; height:18px}
.time{font-size:12px; font-variant-numeric:tabular-nums; color:var(--faint); letter-spacing:.03em}
.rate{display:flex; align-items:center; gap:8px; justify-self:end}
.rate input{width:96px; accent-color:var(--accent); height:5px; cursor:pointer}
.rate output{font-size:14px; font-weight:600; font-variant-numeric:tabular-nums; min-width:3.1em}

@media(max-width:640px){
  .bar{gap:8px} .book{display:none}
  main{padding:28px 18px 0} h1{font-size:31px} .para{font-size:var(--fs,17px); line-height:2.05}
  .bar,nav{padding-left:18px; padding-right:18px}
  .pin{grid-template-columns:auto auto auto 1fr; gap:9px 12px}
  .rate{grid-column:1/-1; justify-self:stretch}
  .rate input{flex:1; width:auto}
}
</style>
</head>
<body>

<header>
  <div class="bar"><span class="book">沉思錄・示範</span><span class="spacer"></span><span class="seg"><a href="/">書架</a><a href="./" aria-current="page">中文</a><a href="bilingual/">對照</a></span>
    <button class="tbtn" id="cfg">設定</button>
<button class="tbtn" id="sync">同步</button><button class="tbtn" id="notes">筆記</button><button class="ver" id="ver" title="點一下檢查更新">0813-0756</button></div>
  <nav id="nav"></nav>
</header>
<button class="peek" id="peek">選單</button>

<main>
  <p class="sub"><span id="sub"></span><button class="dl" id="dl" hidden></button></p>
  <h1 id="title"></h1>
  <p class="hint">點任何一句可以跳過去聽。鎖定畫面也能控制播放。</p>
  <div id="body"></div>
</main>

<div class="player">
  <div class="pin">
    <input class="seek" id="seek" type="range" min="0" max="1000" value="0">
    <button class="nb" id="prev" aria-label="上一章"><svg viewBox="0 0 16 16"><path d="M4 2h2v12H4zM13 2v12L6 8z"/></svg></button>
    <button class="play" id="play" aria-label="播放"><svg id="icon" viewBox="0 0 16 16"><path d="M3 1.5v13l11-6.5z"/></svg></button>
    <button class="nb" id="next" aria-label="下一章"><svg viewBox="0 0 16 16"><path d="M10 2h2v12h-2zM3 2v12l7-6z"/></svg></button>
    <span class="time" id="time">0:00 / 0:00</span>
    <span class="rate"><input id="rate" type="range" min="0.7" max="2" step="0.05" value="1"><output id="rv">1.00×</output></span>
  </div>
</div>

<div class="pop" id="pop"></div>



<div class="np" id="st" hidden>
  <div class="nph"><b>設定</b><span class="sp"></span>
    <button class="tbtn" id="stclose">關閉</button></div>
  <div class="npb">
    <div class="nch">課文字級</div>
    <div class="strow"><input type="range" id="fs" min="16" max="26" step="1" value="19"><output id="fsv">19</output></div>
    <div class="nch">主題</div>
    <button class="tbtn" id="theme">米白</button>
  </div>
</div>

<div class="np" id="sp" hidden>
  <div class="nph"><b>跨裝置同步</b><span class="sp"></span>
    <button class="tbtn" id="spclose">關閉</button></div>
  <div class="npb">
    <p class="spnote">在手機和電腦輸入<b>同一組密語</b>，筆記與閱讀進度就會互通。<br>
      密語只留在這台裝置、不會上傳——送出去的只有它算出來的位置代碼。<br>
      設定後看下面的<b>位置代碼</b>：兩台顯示一樣，才是同一份資料。</p>
    <input class="spin" id="spkey" type="password" placeholder="輸入密語" autocomplete="off">
    <div class="pact">
      <button id="spsave">設定並同步</button>
      <button id="spnow">立即同步</button>
      <button id="spoff">停用</button>
    </div>
    <p class="spst" id="spst"></p>
  </div>
</div>

<div class="np" id="np" hidden>
  <div class="nph"><b>筆記</b><span class="sp"></span>
    <button class="tbtn" id="npcopy">複製全部</button>
    <button class="tbtn" id="npclose">關閉</button></div>
  <div class="npb" id="npb"></div>
</div>
<audio id="au" preload="metadata"></audio>

, 0.162, 0.488], ["嚮往", 0.525, 0.838], ["哲學的", 0.9, 1.338], ["時候", 1.35, 1.888], ["沒有", 2.138, 2.388], ["落", 2.425, 2.525], ["到", 2.537, 2.7], ["任何", 2.7, 3.025], ["詭辯", 3.075, 3.375], ["家", 3.425, 3.6], ["手", 3.6, 3.787], ["上", 3.8, 4.125]]}, {"s": "我也沒把時間浪費在讀歷史、鑽研三段論，或埋頭研究天上的星象。", "start": 491.155, "end": 497.005, "w": [["我", 0.0, 0.15], ["也", 0.162, 0.287], ["沒", 0.3, 0.45], ["把", 0.462, 0.65], ["時間", 0.65, 0.987], ["浪費", 1.0, 1.387], ["在", 1.438, 1.575], ["讀", 1.625, 1.688], ["歷史", 1.762, 2.262], ["鑽研", 2.587, 2.912], ["三段", 2.938, 3.325], ["論", 3.362, 3.625], ["或", 3.987, 4.137], ["埋頭", 4.15, 4.475], ["研究", 4.512, 4.8], ["天上的", 4.862, 5.312], ["星象", 5.325, 5.85]]}, {"s": "這一切，都得靠眾神跟命運幫忙才行。", "start": 497.968, "end": 501.255, "w": [["這", 0.0, 0.188], ["一切", 0.188, 0.688], ["都", 0.938, 1.062], ["得", 1.087, 1.225], ["靠", 1.275, 1.45], ["眾神", 1.5, 1.85], ["跟", 1.95, 2.075], ["命運", 2.075, 2.375], ["幫忙", 2.438, 2.8], ["才", 2.837, 3.012], ["行", 3.037, 3.287]]}, {"s": "這些話，寫在夸迪人地界的格拉努阿河畔。", "start": 502.192, "end": 505.817, "w": [["這些", 0.0, 0.35], ["話", 0.387, 0.737], ["寫", 0.963, 1.162], ["在", 1.188, 1.312], ["夸", 1.375, 1.537], ["迪", 1.55, 1.688], ["人", 1.737, 1.887], ["地界的", 1.975, 2.375], ["格拉", 2.45, 2.787], ["努", 2.8, 2.95], ["阿", 2.95, 3.125], ["河畔", 3.137, 3.625]]}]}], "paras": ["第一卷", "從我祖父維魯斯（Verus）身上，我學到好的品德，還有怎麼管好自己的脾氣。", "從我父親留下的名聲、還有大家對他的記憶裡，我學到謙遜，也學到一個男子漢該有的樣子。", "從我母親身上，我學到虔敬跟樂善好施。她讓我懂得節制——不只是不做壞事，連壞念頭都不要有。再來，她教我生活要簡單，離有錢人那套習慣遠遠的。", "從我曾祖父身上，我學到不必老是往公立學校跑，在家裡請好的老師就好。他也讓我懂得，這種事情該花錢就要大方地花。", "從帶我長大的師傅身上，我學到在賽場（Circus）看比賽的時候不要選邊站，不要當綠隊的人，也不要當藍隊的人；看角鬥士打鬥，也不要偏袒小盾派（Parmularius）或大盾派（Scutarius）。他還教我要能吃苦耐勞，慾望要少，凡事自己動手做，不要多管別人的閒事，也不要一聽到人家講壞話就照單全收。", "從迪奧格內圖斯（Diognetus）身上，我學到不要把心思花在雞毛蒜皮的小事上。那些變戲法的、耍把戲的人講什麼咒語、什麼驅魔趕鬼，我學會不去信這一套。他也讓我不去養鬥鵪鶉，不要沉迷在那種東西裡面。他教我要受得了別人的直言，也讓我開始親近哲學。我先後跟過幾位老師聽課，先是巴奇烏斯（Bacchius），再來是坦達西斯（Tandasis）跟馬奇亞努斯（Marcianus）。我年輕的時候寫過對話錄，也開始嚮往睡木板床、蓋獸皮這種日子——這些都是希臘式修行的一部分。", "從魯斯提庫斯（Rusticus）身上，我才意識到自己的品格還需要改進、需要磨練。他教我的東西很多。他讓我不要走偏，不要去跟人比誰的詭辯厲害，不要寫那些空談玄理的東西，也不要動不動就發表一小段勸世的演講。他讓我不要裝出一副很有修養的樣子，也不要為了給人看才去做好事。他要我遠離華麗的修辭、詩歌，還有那些漂亮的文章。他教我不要穿著外出服在家裡走來走去，這一類的事情都別做。他要我寫信要樸實一點，就像他從西努薩（Sinuessa）寫給我母親的那封信那樣。他還教我，要是有人用言語冒犯我、或是做了對不起我的事，只要對方願意和解，我就該很容易就消氣、跟人和好。他要我讀書要仔細，不要讀個大概就滿足了；別人話講得太多，也不要急著就點頭同意。我還要感謝他——是他把自己收藏的愛比克泰德（Epictetus）講稿拿給我看，我才認識這些內容。", "從阿波羅尼烏斯（Apollonius）身上，我學到意志的自由，還有立定目標之後就毫不動搖的堅定。他讓我懂得，除了理性以外，什麼都不該去看重，連一刻都不行。他教我不管碰到什麼處境都要保持一樣——不管是劇烈的疼痛、失去孩子的時候，還是久病纏身的日子。我從一個活生生的例子清楚看到，同一個人可以既非常剛毅、又願意退讓，教導別人的時候也不會不耐煩。我親眼見到一個人，他明明很有經驗、很擅長講解哲學道理，卻把這些看成自己最不值一提的長處。我還從他身上學到，朋友要給我好處、給我恩惠的時候，我該怎麼接受——既不會因此覺得矮人一截，也不會把人家的好意當作沒看見。", "從塞克斯圖斯（Sextus）那裡，我學到一顆待人和善的心。他把一家人帶得像父親照顧孩子，讓我看到什麼叫順著本性過日子。他為人穩重，卻不做作。他會細心替朋友著想，也容得下沒知識的人，還有那些不經思考就亂下判斷的人。他有辦法隨時去配合每一個人，所以跟他相處，比任何奉承都還要舒服。同時，跟他來往的人，都對他敬重得不得了。他還有一種本事，能夠聰明又有條理地，把生活裡該有的道理一條一條找出來、排好。他從來不發脾氣，也不被任何情緒牽著走，完全不動氣，卻又對人非常有感情。他稱讚人的時候不會大張旗鼓，他懂很多東西，卻一點都不愛炫耀。", "從文法學家亞歷山大（Alexander）那裡，我學到不要愛挑毛病。有人講話用了粗俗、不合文法、或聽起來怪怪的字眼，也不要擺出責備的樣子去糾正他。而是要很有技巧地，把本來該用的講法帶進來。你可以在回答他、附和他、或是跟他一起討論那件事情本身的時候，順帶提一下。重點放在事情上，不是放在用字上，不然就用別的合適方式點一下就好。", "從弗朗托（Fronto）那裡，我學會去看清楚，一個暴君身上的嫉妒、兩面手法跟虛偽，到底長什麼樣子。我也看到，我們這些所謂的貴族，普遍都比較缺乏那種為人父母的慈愛。", "從柏拉圖學派的亞歷山大那裡，我學到不要動不動、也不要沒必要，就對別人說、或在信裡寫說我沒空。也不要老是拿「我事情很忙、很急」當藉口，來推掉那些因為跟身邊人相處、本來就該盡的責任。", "從卡圖盧斯（Catulus）那裡，我學到當朋友對我有意見的時候，不要冷淡以對。就算他是毫無道理地怪我，也要試著讓他回到平常那個好脾氣。我也學到，要樂於稱讚自己的老師，就像人家說的多米提烏斯（Domitius）跟阿泰諾多圖斯（Athenodotus）那樣。還有，要真心去愛我的孩子。", "從我的兄弟塞維魯斯（Severus）那裡，我學到要愛自己的親人、要愛真理、要愛正義。透過他，我認識了特拉塞亞（Thrasea）、赫爾維狄烏斯（Helvidius）、卡圖（Cato）、狄翁（Dion）跟布魯圖斯（Brutus）。也是從他，我得到一個念頭：好的政體，應該對所有人都用同一套法律。它講究權利平等，講話的自由也一樣平等。再來，還有一種王道的治理，最看重的就是被統治者的自由。我還從他身上學到，對哲學要一以貫之，堅定不動搖。要有一顆行善的心，要樂於付出，要懷抱美好的盼望，也要相信朋友是愛我的。我看到他對於那些他所譴責的人，從不隱藏自己的看法。他的朋友根本不用去猜他想要什麼、不想要什麼，因為一切都清清楚楚。", "從馬克西姆斯（Maximus）身上，我學到自我約束，不被任何東西牽著走。不管在什麼處境，就算生病了，也一樣開朗。他的品格裡，溫和跟莊重拿捏得剛剛好。手邊擺著要做的事，就去做，不抱怨。", "我注意到，大家都相信他心口如一，說什麼就是心裡想什麼。他做的每一件事，從來沒有壞心眼。他不會大驚小怪，不會慌慌張張，也不會把事情往後拖。他不會困惑，不會消沉，不會用笑來掩飾心裡的不痛快。反過來說，他也不會情緒暴衝，或疑神疑鬼。", "他習慣做好事，隨時準備原諒別人，身上沒有一絲虛假。他給人的感覺，是一個天生就偏不了正道的人，而不是後天被矯正過來的人。", "我還注意到，沒有人會覺得自己被馬克西姆斯瞧不起，也沒有人敢自以為比他更強。那，他還有一種本事，就是開起玩笑來，讓人聽了很舒服。", "我在我父親身上，看到脾氣的溫和。他經過仔細考量後所下的決定，就絕不動搖。人家所謂的榮譽，他一點都不愛慕虛榮。他愛做事，肯堅持到底。只要有人為了公眾利益提出什麼建議，他都願意聽。他給每個人他應得的那一份，從不偏差。什麼時候該全力去做、什麼時候該放鬆，他都拿捏得準，這是從經驗學來的。", "我還看到，他已經完全克服了對男孩的那種慾念。他把自己看得跟其他任何一個公民一樣，沒把自己抬高。他讓朋友不必非得跟他一起吃飯，出門也不必硬著頭皮陪。有人因為有急事沒能陪他，他對這些人的態度也始終如一。", "我也看到他做事的習慣：凡是要斟酌的事，他都仔細查問。他很有耐性。他絕不會因為滿足於事情表面最先呈現的樣子，就停下追究。他對朋友，是想長長久久維持的那種。他不會很快就對朋友厭倦，可是也不會愛得太過頭。他隨時都很知足，而且開朗。他能預見很遠以後的事，連最小的細節都事先安排好，卻不張揚。群眾的喝采跟一切奉承，他都馬上壓下來。帝國治理上該注意的事，他一直警醒著。他錢管得好，就算為了這種作風被人責怪，他也耐著性子承受。", "他對神明不迷信。他也不靠送禮、討好去籠絡人，更不奉承群眾。他做每件事都很有分寸，也很堅定，從來沒有卑鄙的念頭或行為，也不追求新奇的玩意兒。那些讓日子過得方便、命運又給得很充足的東西，他用起來既不傲慢，也不必替自己找藉口。所以說，有的時候他就好好享受，不做作；沒有的時候，他也不會想要。", "沒有人能說他是個詭辯家，或是家裡養大的輕浮奴才，或是個賣弄學問的書呆子。每個人都承認他是個成熟、完整的人。他在奉承之上，管得好自己的事，也管得好別人的事。除此之外，真正的哲學家他都尊敬。那些假裝是哲學家的，他不去責備，可是也不會輕易被他們牽著走。", "他跟人交談很輕鬆，讓人覺得舒服，卻沒有那種討人厭的做作。他對自己身體的健康，照顧得很合理。他不是那種很貪生的人，也不是為了外表，可是也不是隨隨便便。就因為他自己這樣留意，很少會需要用到醫生的醫術、藥物，或外敷那些東西。", "要是有人具備某種特別的才能，比方口才、懂法律、懂道德，或別的什麼，他都很樂意讓賢，一點都不嫉妒。他還會幫這些人，好讓每個人依照自己應得的，享有名聲。他做事總是照著自己國家的制度來，卻不會擺出一副我很守規矩的樣子。", "再來，他不喜歡變動，也不會反反覆覆。他喜歡待在同樣的地方，做同樣的事。他頭痛發作過後，馬上又精神奕奕地回到平常的工作。他的祕密很少、也很罕見，而且只跟公事有關。公開的表演、公共建築的興建、給人民的捐贈，這類事情他辦得又謹慎又節省。因為他這個人，看的是什麼事該做，而不是一個人靠自己的作為賺到的名聲。", "他不會在不對的時辰去洗澡。他不愛蓋房子，不講究吃什麼，也不在意衣服的材質跟顏色，更不在意奴隸長得漂不漂亮。他的衣服來自羅利烏姆（Lorium），就是他海邊的別墅，平常也多半來自拉努維姆（Lanuvium）。我們都知道他怎麼對待圖斯庫盧姆（Tusculum）那個向他賠罪的收費員，他一貫都是這個樣子。", "他身上沒有任何嚴厲，沒有任何記恨，沒有任何粗暴，也可以說，沒有任何硬撐到滿頭大汗的東西。他把每件事一件一件分開來檢視，好像時間很充裕似的，一點都不慌亂，很有條理，強而有力，又前後一致。", "人家記載蘇格拉底的那句話，也可以套在他身上：很多人太軟弱，有些東西他們既戒不掉，享受起來又一定過頭；他卻是既戒得掉，也能好好享受。可是能夠又忍得住這一邊、又在那一邊保持清醒節制，這就是一個靈魂完美、無可擊敗的人的印記。他在馬克西姆斯生病那段時間，展現的正是這樣。", "我要謝謝眾神，讓我有好的祖父、好的父母、一個好妹妹，還有好老師、好夥伴，以及好的親戚跟朋友。幾乎所有美好的東西，我都有了。", "再來，我也感謝眾神，讓我沒有一時衝動就去冒犯他們任何一個人。我這個人的性子，其實只要一有機會，說不定就會做出那種事來。但靠著他們的眷顧，一直沒有湊巧碰上那種讓我受考驗的場面。", "再來，我要謝謝眾神，讓我沒有繼續待在祖父的妾室身邊長大。我保住了青春的純潔。我沒有太早去證明自己的男子本事，反而還把那個時間往後延了。", "我也感謝眾神，讓我遇到一位既是君主、又是父親的人。他能把我身上的驕氣全部拿掉。他讓我明白一件事：一個人住在皇宮裡，其實可以過得很簡單。不用衛兵，不用繡花的衣袍，也不用火炬、雕像那些排場。這樣的人，還是有辦法把自己過得跟一般平民差不多。可是這樣做，不會讓他的想法變得比較卑下。也不會讓他在該為公眾辦的事情上偷懶怠慢。該拿出君主的樣子，他還是拿得出來。", "我要謝謝眾神，給了我這樣一個兄弟。他的品格能提醒我，時時看緊自己。同時他對我的尊重跟疼愛，也讓我很窩心。", "我也感謝，我的孩子們既不笨，身體也沒有殘缺。", "還有，我在修辭、詩歌，以及其他學問上，並沒有變得太出色。要是我當初看到自己在這些上面很有長進，說不定就一頭栽進去，整個人都陷在裡面了。", "我也感謝，我趕緊把那些從小把我帶大的人，安置到他們似乎想要的尊榮位子上。我沒有拿「以後再說」來拖延他們，因為那時候他們都還年輕。", "我也慶幸自己認識了阿波羅尼烏斯、魯斯提庫斯，還有馬克西姆斯。", "我常常清清楚楚地體會到，什麼叫做順著自然而活，那樣的人生又是什麼樣子。所以說，只要是靠眾神、靠他們的恩賜、幫助跟啟發的那一部分，就沒有什麼能攔著我，馬上照著自然去過日子。只是我自己還做得不夠好。這是我自己的錯，是我沒有好好聽眾神的勸告——我幾乎可以說，那是他們直接給我的指示。", "我也感謝，我這副身體，在這種生活底下，居然撐了這麼久。", "我這輩子從來沒碰過貝內迪克塔（Benedicta），也沒碰過忒奧多圖斯（Theodotus）。而且就算曾經陷進情慾裡，後來也被治好了。", "還有，雖然我常常對魯斯提庫斯生悶氣，可是我從來沒做出什麼，讓我後來需要後悔的事。", "我也感謝，雖然我母親命裡註定早逝，但她生命最後那幾年，是跟我一起度過的。", "還有，每當我想幫哪個人度過難關，或是在別的場合想伸出援手，從來沒有人跟我說我沒那個能力做。而我自己呢，也從來沒淪落到非得接受別人接濟不可的地步。", "我也慶幸自己娶到這樣一位妻子，這麼順從、這麼深情，又這麼單純。", "我還有一大堆好老師，可以教我的孩子。", "還有，眾神透過夢境指點過我一些療法。有的治別的毛病，有的專治咳血跟頭暈……", "還有，當我心裡嚮往哲學的時候，我沒有落到任何一個詭辯家手上。我也沒把時間浪費在讀那些寫歷史的人身上，沒去鑽研那些三段論的推演，也沒有一頭埋進天上星象的探究裡。因為這一切，都得靠眾神跟命運幫忙才行。", "在夸迪人（Quadi）的地界，格拉努阿河（Granua）畔。"], "audio": "ch01.m4a", "n": 1}, {"title": "卷一・精讀版", "duration": 1089.47, "points": [{"t": "第一卷從我祖父維魯斯身上，我學到好的品德，還有怎麼管好自己的脾氣。從我父親留下的名聲、還有大家對他的記憶裡，我學到謙遜，也學到一個男子漢該有的樣子。從我母親身上，我學到虔敬跟樂善好施。她讓我懂得節制——不只是不做壞事，連壞念頭都不要有。", "src": [0, 0], "start": 0.1, "end": 26.075, "sents": [{"s": "第一卷", "start": 0.1, "end": 0.725, "w": [["第一卷", 0.0, 0.625]]}, {"s": "從我祖父維魯斯身上，我學到好的品德，還有怎麼管好自己的脾氣。", "start": 1.613, "end": 7.3, "w": [["從", 0.0, 0.212], ["我", 0.225, 0.363], ["祖父", 0.4, 0.725], ["維魯", 0.75, 1.088], ["斯", 1.088, 1.25], ["身上", 1.275, 1.8], ["我", 2.075, 2.188], ["學到", 2.213, 2.538], ["好的", 2.562, 2.838], ["品德", 2.888, 3.388], ["還有", 3.713, 3.975], ["怎麼", 4.038, 4.275], ["管", 4.338, 4.487], ["好", 4.513, 4.688], ["自己的", 4.737, 5.138], ["脾氣", 5.175, 5.688]]}, {"s": "從我父親留下的名聲、還有大家對他的記憶裡，我學到謙遜，也學到一個男子漢該有的樣子。", "start": 8.238, "end": 15.863, "w": [["從", 0.0, 0.212], ["我", 0.225, 0.375], ["父親", 0.387, 0.7], ["留下的", 0.725, 1.188], ["名聲", 1.2, 1.7], ["還有", 2.05, 2.3], ["大家", 2.362, 2.675], ["對", 2.725, 2.812], ["他的", 2.837, 3.125], ["記憶", 3.15, 3.412], ["裡", 3.45, 3.762], ["我", 4.037, 4.15], ["學到", 4.175, 4.5], ["謙遜", 4.512, 5.0], ["也", 5.3, 5.425], ["學到", 5.462, 5.825], ["一個", 5.837, 6.05], ["男子漢", 6.062, 6.625], ["該", 6.675, 6.825], ["有的", 6.837, 7.0 const esc2 = t => t.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
/* 依標點把句子切成小句，一小句一個反黑單位——比逐字跳動貼近人讀書的節奏 */
function tile(text, words, notes) {
  if (!words || !words.length) return markN(text, notes);
  const pos = []; let p = 0;
  words.forEach(([w, a, b]) => {
    const at = text.indexOf(w, p);
    if (at < 0) return;
    pos.push({ at, a, b }); p = at + w.length;
  });
  if (!pos.length) return esc2(text);
  const cuts = []; const re = /[，、。；：！？,;:.!?—]+/g; let m;
  while ((m = re.exec(text))) cuts.push(m.index + m[0].length);
  if (!cuts.length || cuts[cuts.length - 1] < text.length) cuts.push(text.length);
  let h = '', from = 0;
  cuts.forEach(c => {
    const seg = text.slice(from, c);
    const ws = pos.filter(x => x.at >= from && x.at < c);
    const inner = markN(seg, notes);
    h += ws.length
      ? `<em data-a="${ws[0].a}" data-b="${ws[ws.length - 1].b}">${inner}</em>`
      : inner;
    from = c;
  });
  return h + markN(text.slice(from), notes);
}
/* 生字對應詞標虛線（在已跳脫的文字上） */
function markN(text, notes) {
  let h = esc2(text);
  (notes || []).slice().sort((a, b) => b[1].length - a[1].length).forEach(([e, z]) => {
    const zz = esc2(z).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    h = h.replace(new RegExp('(?<!>)(' + zz + ')(?!<)'),
      `<i class="n" data-e="${esc2(e)}">$1</i>`);
  });
  return h;
}

const AUDIO_CACHE = 'nn-audio-v1';
const canOffline = 'serviceWorker' in navigator && 'caches' in window && isSecureContext;
if (canOffline) {
/* iOS 主畫面 App 不會自己檢查新版，得手動催 */
(function () {
  if (!('serviceWorker' in navigator) || !isSecureContext) return;
  let reloading = false;

  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!had || reloading) return;

    reg.addEventListener('updatefound', () => {

const key = a => new URL(a, location).href;

async function dlState(d) {
  const b = $('dl');
  if (!canOffline) { b.hidden = true; return; }
  b.hidden = false; b.disabled = false;
  const c = await caches.open(AUDIO_CACHE);
  const has = await c.match(new Request(key(d.audio)));
  b.dataset.s = has ? 'done' : 'no';
  b.textContent = has ? '已離線' : '下載離線';
  b.onclick = () => (has ? remove(d) : download(d));
}

async function download(d) {
  const b = $('dl'); b.disabled = true; b.textContent = '0%';
  try {
    const r = await fetch(d.audio);
    const total = +r.headers.get('content-length') || 0;
    const rd = r.body.getReader(); const parts = []; let got = 0;
    for (;;) {
      const { done, value } = await rd.read();
      if (done) break;
      parts.push(value); got += value.length;
      b.textContent = total ? Math.round(got / total * 100) + '%' : '下載中';
    }
    const blob = new Blob(parts, { type: 'audio/mp4' });
    const c = await caches.open(AUDIO_CACHE);
    await c.put(new Request(key(d.audio)), new Response(blob, {
      headers: { 'Content-Type': 'audio/mp4', 'Content-Length': String(blob.size) } }));
  } catch (e) { b.textContent = '下載失敗'; setTimeout(() => dlState(d), 1800); return; }
  dlState(d);
}

async function remove(d) {
  const c = await caches.open(AUDIO_CACHE);
  await c.delete(new Request(key(d.audio)));
  dlState(d);
}

/* ── 跨裝置同步 ──────────────────────────────────────────────
   Firestore 一份文件裝全部書的筆記與進度，文件位置＝密語的 SHA-256。
   密語只留在裝置上、不上傳；沒設密語就完全不連線。
   走 REST 不載 SDK：省一整包，也避開主畫面 App 的登入導向坑。 */
const FS = k => 'https://firestore.googleapis.com/v1/projects/YOUR-FIREBASE-PROJECT'
  + '/databases/(default)/documents/sync/' + k;
const SK = () => localStorage.getItem('nn-sync') || '';

async function hashKey(s) {
  /* 先正規化再雜湊：全形轉半形（NFKC）、去掉所有空白、轉小寫。
     手機輸入法很容易打出全形字或多一個空格，看起來一樣、雜湊完全不同，
     兩台就會各同步到各的文件，永遠碰不到面——實際發生過（2026-08-07）。 */
  const t = s.normalize('NFKC').replace(/\s+/g, '').toLowerCase();
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}
/* 位置代碼＝雜湊前四碼。兩台顯示一樣，才是同一份資料 */
const fp = () => SK() ? '・位置代碼 ' + SK().slice(0, 4).toUpperCase() : '';

/* localStorage 是整個站共用，所以任何一頁都掃得到全部書的狀態 */
function localState() {
  const b = {}, get = s => (b[s] = b[s] || { mt: 0, done: {}, pos: {}, hl: {} });
  for (const k of Object.keys(localStorage)) {
    let m;
    if ((m = /^nn-(.+)-(ch|hl|mt)$/.exec(k))) {
      const o = get(m[1]), v = localStorage.getItem(k);
      if (m[2] === 'ch') o.ch = Number(v) || 0;
      else if (m[2] === 'mt') o.mt = Number(v) || 0;
      else { try { o.hl = JSON.parse(v) || {}; } catch (e) {} }
    } else if ((m = /^nn-(.+)-(done|pos)-(\d+)$/.exec(k))) {
      const o = get(m[1]);
      if (m[2] === 'done') o.done[m[3]] = 1;
      else o.pos[m[3]] = Number(localStorage.getItem(k)) || 0;
    }
  }
  return { v: 1, b: b };
}

function applyState(st) {
  for (const s in st.b) {
    const o = st.b[s], p = 'nn-' + s + '-';
    if (o.ch) localStorage.setItem(p + 'ch', String(o.ch));
    localStorage.setItem(p + 'mt', String(o.mt || 0));
    for (const n in (o.done || {})) localStorage.setItem(p + 'done-' + n, '1');
    for (const n in (o.pos || {})) localStorage.setItem(p + 'pos-' + n, String(o.pos[n]));
    localStorage.setItem(p + 'hl', JSON.stringify(o.hl || {}));
  }
}

/* 合併規則：
   筆記   逐條比時間，新的贏（刪除留墓碑，才不會被另一台復活）
   已讀   聯集，標過就是標過
   章與位置  整組取「最近讀過那一台」的，免得舊裝置把新進度蓋掉 */
function mergeState(a, c) {
  const out = { v: 1, b: {} };
  const names = {};
  for (const s in a.b) names[s] = 1;
  for (const s in c.b) names[s] = 1;
  for (const s in names) {
    const blank = { mt: 0, done: {}, pos: {}, hl: {} };
    const x = a.b[s] || blank, y = c.b[s] || blank;
    const newer = (y.mt || 0) > (x.mt || 0) ? y : x;
    const hl = Object.assign({}, x.hl || {});
    for (const k in (y.hl || {})) {
      const p = hl[k], q = y.hl[k];
      if (!p || (q.ts || 0) >= (p.ts || 0)) hl[k] = q;
    }
    out.b[s] = {
      mt: Math.max(x.mt || 0, y.mt || 0),
      /* 兩邊都沒有時間戳（同步功能上線前的舊資料）就取讀比較遠的那台，
         不然電腦的第 3 章會贏過手機的第 7 章 */
      ch: (x.mt || 0) === (y.mt || 0) ? Math.max(x.ch || 0, y.ch || 0)
                                      : (newer.ch || x.ch || y.ch || 0),
      pos: Object.assign({}, x.pos || {}, y.pos || {}, newer.pos || {}),
      done: Object.assign({}, x.done || {}, y.done || {}),
      hl: hl
    };
  }
  return out;
}

function stamp(slug) { localStorage.setItem('nn-' + slug + '-mt', String(Date.now())); }

let syncing = false;
async function syncNow(manual) {
  const k = SK();
  if (!k) { if (manual) syncOpen(); return; }
  if (syncing) return;
  syncing = true; syncSay('同步中…');
  try {
    let remote = { v: 1, b: {} };
    const r = await fetch(FS(k), { cache: 'no-store' });
    if (r.ok) {
      const j = await r.json();
      const s = j.fields && j.fields.blob && j.fields.blob.stringValue;
      if (s) remote = JSON.parse(s);
    } else if (r.status !== 404) {
      throw new Error('讀取失敗 ' + r.status);
    }
    const merged = mergeState(localState(), remote);
    applyState(merged);
    const w = await fetch(FS(k), {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fields: { blob: { stringValue: JSON.stringify(merged) } } })
    });
    if (!w.ok) throw new Error('寫入失敗 ' + w.status);
    syncSay('已同步・' + new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' }) + fp());
    if (typeof afterSync === 'function') afterSync();
  } catch (e) {
    syncSay(e.message || '同步失敗', true);
  }
  syncing = false;
}

/* 工具列自動收合：往下滑累積 90px 就收、往上滑 22px 就回來，
   靠近頁首一律顯示。播放時的自動捲動也會把它收起來——正好是閱讀模式。 */
(() => {

    document.documentElement.style.setProperty('--hh', hd.offsetHeight + 'px'); };
  fit(); setTimeout(fit, 350); addEventListener('resize', fit);
  const show = () => hd.classList.remove('hid');
  const hide = () => { if (scrollY > 150) hd.classList.add('hid'); };
  let ty = 0, tacc = 0, skip = false;

  addEventListener('touchmove', e => {
    if (skip) return;
    const y = e.touches[0].clientY, d = y - ty; ty = y;
    if ((d > 0) !== (tacc > 0)) tacc = 0;
    tacc += d;
    if (tacc > 18) show();
    else if (tacc < -70) hide();
  }, { passive: true });
  let wacc = 0, wt = 0;
  addEventListener('wheel', e => {
    const now = Date.now();
    if (now - wt > 300) wacc = 0;
    wt = now; wacc += e.deltaY;
    if (wacc < -30) { wacc = 0; show(); }
    else if (wacc > 140) { wacc = 0; hide(); }
  }, { passive: true });
  addEventListener('scroll', () => { if (scrollY < 70) show(); }, { passive: true });
  /* 保證路徑：收合時頂端固定顯示「選單」鈕，點了一定回來 */
  document.getElementById('peek').onclick = () => show();
})();

/* 筆記跳回原文：切章（不自動播）、捲到那句、閃一下 */
function jumpToNote(c, si) {
  $('np').hidden = true;
  if (!DATA[ci] || DATA[ci].n !== c) {
    const i = DATA.findIndex(x => x.n === c);
    if (i < 0) return;
    load(i, false);
  }
  const el = spans[si];
  if (!el) return;
  el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  el.classList.add('fl');
  setTimeout(() => el.classList.remove('fl'), 1500);
}

/* 字級：全站記住。跟主題一樣是這台裝置的偏好，不進同步 */
function setFs(v) {
  v = Math.min(26, Math.max(16, Number(v) || 19));
  document.documentElement.style.setProperty('--fs', v + 'px');
  localStorage.setItem('nn-fs', String(v));
  $('fs').value = v; $('fsv').textContent = v;
}
if (localStorage.getItem('nn-fs')) setFs(localStorage.getItem('nn-fs'));
$('fs').oninput = e => setFs(e.target.value);
$('cfg').onclick = () => { $('st').hidden = false; };
$('stclose').onclick = () => { $('st').hidden = true; };

if (!DATA.length) $('body').innerHTML = '<p class="empty">還沒有任何章節產出。</p>';
else { const w = Number(localStorage.getItem(K('ch')) || 0);
       load(Math.max(0, DATA.findIndex(c => c.n === w)), false); }
</script>
