<!doctype html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>中英對照・沉思錄・示範</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F0E12" id="tc">
<style>
:root{--bg:#0F0E12;--surface:#201D24;--accent:#FF4D85;--ink:#FFFFFF;--ink2:#B8B4BE;
      --faint:#7C7786;--line:#312D38;--lit:rgba(255,77,133,.13)}
:root[data-theme="light"]{--bg:#F4F1E8;--surface:#FFFFFF;--accent:#3A5A8C;--ink:#26251F;
      --ink2:#6B6659;--faint:#9A9484;--line:#DAD5C6;--lit:rgba(58,90,140,.11)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font-weight:400;
 font-family:"Inter","PingFang TC","Noto Sans TC",-apple-system,sans-serif;
 -webkit-font-smoothing:antialiased;padding-bottom:calc(140px + env(safe-area-inset-bottom))}

header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
 padding-top:env(safe-area-inset-top)}
.bar{max-width:760px;margin:0 auto;padding:15px 24px 0;display:flex;align-items:center;gap:10px}
.book{font-size:12px;font-weight:600;letter-spacing:.24em;color:var(--faint)}
.sp{flex:1}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg a{font:inherit;font-size:11px;letter-spacing:.14em;color:var(--ink2);text-decoration:none;
 padding:6px 12px;white-space:nowrap;transition:background .2s,color .2s}
.seg a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.tb{background:none;border:1px solid var(--line);color:var(--ink2);cursor:pointer;font:inherit;
 font-size:11px;letter-spacing:.14em;padding:6px 11px;border-radius:6px;white-space:nowrap}
.tb[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
#chnav{max-width:760px;margin:0 auto;padding:12px 24px 0;display:flex;gap:6px;
 overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#chnav::-webkit-scrollbar{display:none}
#chnav button{flex:none;background:none;border:1px solid var(--line);border-radius:7px;
 color:var(--ink2);font:inherit;font-size:13px;font-variant-numeric:tabular-nums;
 padding:7px 14px;cursor:pointer;white-space:nowrap}
#chnav button[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#chnav button:disabled{opacity:.42;cursor:default}
#chnav button.done::after{content:"";display:inline-block;width:5px;height:5px;
 border-radius:50%;background:var(--accent);margin-left:7px;vertical-align:2px}
.tabs{max-width:760px;margin:0 auto;padding:13px 24px 0;display:flex;gap:22px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--faint);
 font:inherit;font-size:14px;font-weight:600;padding:0 0 11px;cursor:pointer;letter-spacing:.04em}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tabs span{font-size:11px;color:var(--faint);font-weight:400;margin-left:5px}

main{max-width:760px;margin:0 auto;padding:38px 24px 0}
.kick{font-size:12px;font-weight:600;letter-spacing:.28em;color:var(--faint);margin:0 0 14px}
h1{font-size:42px;font-weight:700;letter-spacing:-.01em;line-height:1.15;margin:0 0 12px}
.hint{font-size:13px;line-height:1.8;color:var(--ink2);margin:0 0 36px;padding-bottom:22px;
 border-bottom:1px solid var(--line)}

/* 課文 */
.pt{margin:0 0 30px;padding-left:18px;position:relative}
.pt::before{content:"";position:absolute;left:0;top:.4em;bottom:.2em;width:2px;
 background:var(--line);border-radius:2px;transition:background .25s}
.pt.on::before{background:var(--accent)}
.s{margin:0 0 16px}
.en{font-size:19px;line-height:1.85;cursor:pointer;border-radius:5px;display:block;padding:2px 0;
 transition:background .18s,color .18s}
.s.on .en{background:var(--lit)}
.en em,.zh em,.stn em,.sten em,.stzh em,.sum em{font-style:normal;border-radius:3px;
 transition:background .15s,color .15s}
.en em.now,.zh em.now,.stn em.now,.sten em.now,.stzh em.now,.sum em.now{
 background:var(--accent);color:var(--bg)}
:root[data-theme="light"] .en em.now,:root[data-theme="light"] .zh em.now,
:root[data-theme="light"] .stn em.now,:root[data-theme="light"] .sten em.now,
:root[data-theme="light"] .stzh em.now,:root[data-theme="light"] .sum em.now{color:#fff}
.s.past .en{color:var(--ink2)}
.zh{font-size:15px;line-height:1.9;color:var(--ink2);margin:5px 0 0;display:block;
 border-radius:5px;padding:1px 0;transition:background .18s,color .18s}
.s.zh-on .zh{background:var(--lit);color:var(--ink)}
body.hide-zh .zh{display:none}
i.n{font-style:normal;border-bottom:1px dotted var(--faint);cursor:pointer}
.s.on i.n{border-bottom-color:var(--accent)}

/* 解析 */
.st{padding:0 0 30px;margin:0 0 30px;border-bottom:1px solid var(--line)}
.st:last-of-type{border-bottom:0}
.sten{font-size:18px;line-height:1.8;font-weight:500;margin:0 0 6px;cursor:pointer}
.sten:hover{color:var(--accent)}
.stzh{font-size:15px;line-height:1.9;color:var(--ink2);margin:0 0 15px}
.stn{border-left:1px solid var(--line);padding-left:15px;margin:0 0 11px}
.stn:last-child{margin-bottom:0}
.stnh{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin:0 0 3px}
.stw{font-size:15px;font-weight:600}
.stm{font-size:13px;color:var(--faint);cursor:pointer}

.stwhy{font-size:14px;line-height:1.9;color:var(--ink2);margin:0;max-width:56ch}
.lit{background:var(--lit);color:var(--ink);border-radius:5px;
 box-shadow:0 0 0 3px var(--lit);transition:background .18s,color .18s}
.stn.lit{box-shadow:none;border-left-color:var(--accent);padding-top:3px;padding-bottom:3px}
.sum li.lit,.sum .take.lit{color:var(--ink)}
.v.lit{box-shadow:-14px 0 0 0 var(--lit),14px 0 0 0 var(--lit);background:var(--lit);
 border-radius:6px}
.sum{margin:40px 0 0;padding:26px 0 0;border-top:1px solid var(--line)}
.sum h2{font-size:12px;font-weight:600;letter-spacing:.28em;color:var(--faint);margin:0 0 18px}
.sum li{font-size:15px;line-height:2;color:var(--ink2);margin:0 0 11px}
.sum ul{margin:0;padding-left:19px}
.sum .take{font-size:16px;line-height:1.95;margin:22px 0 0;padding-left:16px;
 border-left:2px solid var(--accent)}

/* 生字 */
.vocab{margin:0}
.v{padding:24px 0;border-bottom:1px solid var(--line)}
.v:first-child{padding-top:4px}
.vhead{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap;margin:0 0 3px}
.vw{font-size:22px;font-weight:600;letter-spacing:-.005em}
.spk{width:26px;height:26px;flex:none;border-radius:50%;border:1px solid var(--line);
 background:none;color:var(--ink2);cursor:pointer;display:grid;place-items:center;
 align-self:center;transition:border-color .2s,color .2s}
.spk:hover,.spk.on{border-color:var(--accent);color:var(--accent)}
.spk svg{width:12px;height:12px;fill:currentColor}
.spk.slow{width:auto;border-radius:13px;padding:0 9px;font-size:11px;letter-spacing:.1em;
 height:26px;line-height:1}
.vuse.on{border-left-color:var(--accent)}
.kk{font-size:14px;color:var(--faint);font-family:ui-monospace,Menlo,monospace}
.pos{font-size:11px;letter-spacing:.14em;color:var(--faint);border:1px solid var(--line);
 border-radius:4px;padding:2px 7px}
.vn{font-size:11px;color:var(--faint);letter-spacing:.1em;margin-left:auto}
.vm{font-size:16px;color:var(--ink);margin:0 0 9px}
.vdef{font-size:14px;line-height:1.95;color:var(--ink2);margin:0 0 14px;max-width:56ch}
.vuse{border-left:1px solid var(--line);padding:2px 0 2px 14px;margin:0 0 12px;cursor:pointer;
 transition:border-color .2s}
.vuse:hover{border-left-color:var(--accent)}
.vuse .e{display:block;font-size:15px;line-height:1.75}
.vuse .z{display:block;font-size:13px;line-height:1.75;color:var(--faint);margin-top:3px}
.vc{font-size:13px;line-height:1.85;color:var(--faint);cursor:pointer}
.vc::before{content:"書中　";letter-spacing:.14em;color:var(--line)}
.vc:hover{color:var(--ink2)}
.vc mark{background:none;color:var(--ink2);border-bottom:1px dotted var(--accent)}

.pop{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--line);
 border-radius:10px;padding:11px 14px;max-width:min(320px,86vw);
 box-shadow:0 12px 34px -14px rgba(0,0,0,.55);font-size:14px;line-height:1.6;display:none}
.pop b{display:block;font-size:13px;letter-spacing:.04em;color:var(--accent);margin-bottom:3px}
.pact{display:flex;gap:8px;margin-top:10px}
.pact button{background:none;border:1px solid var(--line);border-radius:6px;color:var(--ink2);
 font:inherit;font-size:12px;letter-spacing:.08em;padding:5px 11px;cursor:pointer}
.pact button:hover{border-color:var(--accent);color:var(--accent)}

.player{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);
 border-top:1px solid var(--line);
 padding:11px calc(20px + env(safe-area-inset-left)) calc(13px + env(safe-area-inset-bottom))
         calc(20px + env(safe-area-inset-right))}
.pin{max-width:760px;margin:0 auto;display:grid;gap:10px 15px;
 grid-template-columns:auto 1fr auto;align-items:center}
.seek{grid-column:1/-1;width:100%;accent-color:var(--accent);height:5px;cursor:pointer;margin:0}
.play{width:46px;height:46px;border-radius:50%;border:none;background:var(--ink);color:var(--bg);
 cursor:pointer;display:grid;place-items:center}
.play svg{width:18px;height:18px;fill:currentColor}
.time{font-size:12px;font-variant-numeric:tabular-nums;color:var(--faint)}
.rate{display:flex;align-items:center;gap:8px}
.rate input{width:100px;accent-color:var(--accent);height:5px}
.rate output{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;min-width:3.1em}
@media(max-width:640px){
  .bar{gap:7px;flex-wrap:wrap}
  .book{display:none}
  .tb{padding:6px 9px;letter-spacing:.08em}
  .seg a{padding:6px 10px;letter-spacing:.08em}
  main{padding:26px 18px 0}h1{font-size:31px}.en{font-size:17px}.vw{font-size:18px}
  .bar,.tabs{padding-left:18px;padding-right:18px}.player{padding-left:18px;padding-right:18px}
  .v{grid-template-columns:1fr}.vm,.vn{justify-self:start;text-align:left}
}
</style>
</head>

<header>
  <div class="bar"><span class="book">沉思錄・示範</span><span class="sp"></span><span class="seg"><a href="/">書架</a><a href="../">中文</a><a href="./" aria-current="page">對照</a></span>

<span style="font-size:10px;color:var(--faint);letter-spacing:.1em">0804-0039</span></div>
  <nav id="chnav"></nav>
  <div class="tabs">
    <button id="tab-text" aria-selected="true">課文</button>
    <button id="tab-study" aria-selected="false">解析</button>

  </div>
</header>

<main>
  <p class="kick" id="kick"></p>
  <h1 id="title">Book I</h1>

</main>

<div class="pop" id="pop"></div>

  const had = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!had || reloading) return;
    reloading = true; location.reload();
  });
  navigator.serviceWorker.register('/sw.js').then(reg => {
    const check = () => reg.update().catch(() => {});
    check();
    addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
    addEventListener('focus', check);
    setInterval(check, 60000);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      if (!w) return;
      w.addEventListener('statechange', () => {
        if (w.state === 'installed' && navigator.serviceWorker.controller) {
          const b = document.createElement('button');
          b.textContent = '有新版，點此更新';
          b.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);' +
            'bottom:calc(150px + env(safe-area-inset-bottom));z-index:99;border:0;' +
            'border-radius:20px;padding:10px 18px;font:inherit;font-size:13px;' +
            'background:var(--accent);color:#fff;cursor:pointer;box-shadow:0 8px 24px -8px rgba(0,0,0,.5)';
          b.onclick = () => { w.postMessage('skip'); reloading = false; };
          document.body.appendChild(b);
        }
      });
    });
  }).catch(() => {});
})();

const DATA = [{"mode": "bilingual", "n": 1, "title": "卷一・對照節選", "tracks": {"en": {"audio": "ch01-en.m4a", "duration": 210.78, "paras": [{"sents": [{"en": "From my grandfather Verus I learned good morals and the government of my temper.", "zh": "從我祖父維魯斯身上，我學到好的品德，還有怎麼管好自己的脾氣。", "notes": [{"w": "the government of my temper", "m": "管好自己的脾氣", "kk": "/ˋtɛmpɚ/", "pos": "片語", "def": "government 在這裡是古典用法，指「約束、控制」，不是政府；temper 是脾氣、性子。整個片語字面是「對脾氣的治理」。", "use": "Meditation helps with the government of my temper.", "useZh": "靜坐幫助我管好自己的脾氣。", "why": "把管脾氣說成一門「治理」，是羅馬人的莊重講法——脾氣不是壓下去，是治理好。", "zhw": "管好"}], "start": 0.0, "end": 4.05, "ew": [["From", 0.1, 0.338], ["my", 0.35, 0.5], ["grandfather", 0.512, 1.15], ["Verus", 1.163, 1.587], ["I", 1.6, 1.688], ["learned", 1.7, 2.025], ["good", 2.038, 2.2], ["morals", 2.212, 2.638], ["and", 2.65, 2.75], ["the", 2.763, 2.837], ["government", 2.85, 3.263], ["of", 3.275, 3.362], ["my", 3.375, 3.538], ["temper", 3.55, 4.05]]}]}, {"sents": [{"en": "From the reputation and remembrance of my father, modesty and a manly character.", "zh": "從我父親留下的名聲、還有大家對他的記憶裡，我學到謙遜，也學到一個男子漢該有的樣子。", "notes": [{"w": "remembrance", "m": "眾人的追憶", "kk": "/rɪˋmɛmbrəns/", "pos": "名詞", "def": "指留在別人心中的記憶與懷念，比 memory 正式，常用在對逝者的追思。", "use": "The park was built in remembrance of the founder.", "useZh": "這座公園是為了紀念創辦人而建的。", "why": "父親早逝，作者是從別人「對他的追憶」認識父親的——一個字就把這層距離講出來。", "zhw": "記憶"}, {"w": "modesty", "m": "謙遜", "kk": "/ˋmɑdəstɪ/", "pos": "名詞", "def": "不誇耀自己、不搶功勞的品格；形容詞是 modest，也可指衣著或用度的樸素。", "use": "Her modesty kept her from mentioning the award.", "useZh": "她太謙虛了，得獎的事提都沒提。", "why": "羅馬人眼中的男子氣概不是張揚，是收斂——所以謙遜和男子漢擺在同一句。", "zhw": "謙遜"}], "start": 5.37, "end": 9.895, "ew": [["From", 0.1, 0.362], ["the", 0.375, 0.45], ["reputation", 0.463, 1.163], ["and", 1.175, 1.312], ["remembrance", 1.325, 1.837], ["of", 1.85, 1.95], ["my", 1.962, 2.15], ["father", 2.163, 2.625], ["modesty", 2.837, 3.288], ["and", 3.375, 3.487], ["a", 3.5, 3.538], ["manly", 3.55, 3.925], ["character", 3.938, 4.525]]}]}, {"sents": [{"en": "From my mother, piety and beneficence, and abstinence, not only from evil deeds, but even from evil thoughts;", "zh": "從我母親身上，我學到虔敬跟樂善好施。她讓我懂得節制——不只是不做壞事，連壞念頭都不要有。", "notes": [{"w": "piety", "m": "虔敬", "kk": "/ˋpaɪətɪ/", "pos": "名詞", "def": "對神明、長輩發自內心的敬意與盡責；宗教味比 respect 重，形容詞是 pious。", "use": "She lights incense every morning out of piety.", "useZh": "她每天早上上香，是出於虔敬。", "why": "羅馬人把對神和對家的盡責看成同一種德性，這個字兩層都包。", "zhw": "虔敬"}, {"w": "abstinence", "m": "節制、戒絕", "kk": "/ˋæbstənəns/", "pos": "名詞", "def": "主動不去碰某樣東西的自制，對象常是酒、慾望、享樂；動詞是 abstain from。", "use": "The doctor advised abstinence from alcohol.", "useZh": "醫生建議他戒酒。", "why": "重點在後半句：連壞念頭都要戒——節制做到念頭那一層，才是這句的力道。", "zhw": "節制"}], "start": 11.22, "end": 18.082, "ew": [["From", 0.1, 0.388], ["my", 0.4, 0.55], ["mother", 0.562, 0.925], ["piety", 1.163, 1.625], ["and", 1.712, 1.837], ["beneficence", 1.85, 2.562], ["and", 2.763, 2.888], ["abstinence", 2.9, 3.587], ["not", 3.812, 4.037], ["only", 4.05, 4.287], ["from", 4.3, 4.5], ["evil", 4.513, 4.775], ["deeds", 4.787, 5.2], ["but", 5.375, 5.525], ["even", 5.537, 5.775], ["from", 5.787, 5.963], ["evil", 5.975, 6.25], ["thoughts", 6.263, 6.862]]}, {"en": "and further, simplicity in my way of living, far removed from the habits of the rich.", "zh": "再來，她教我生活要簡單，離有錢人那套習慣遠遠的。", "notes": [{"w": "far removed from", "m": "離…非常遠", "kk": "/rɪˋmuvd/", "pos": "片語", "def": "不只是距離遠，更是性質上完全不同、劃清界線的意思。", "use": "His new life is far removed from the city noise.", "useZh": "他的新生活離城市的喧囂遠遠的。", "why": "身為未來皇帝卻要「離有錢人的習慣遠遠的」——這個片語把距離感拉到最大。", "zhw": "遠遠的"}], "start": 19.398, "end": 24.135, "ew": [["and", 0.1, 0.312], ["further", 0.325, 0.738], ["simplicity", 0.912, 1.5], ["in", 1.512, 1.65], ["my", 1.663, 1.812], ["way", 1.825, 2.075], ["of", 2.087, 2.2], ["living", 2.212, 2.575], ["far", 2.8, 2.962], ["removed", 2.975, 3.475], ["from", 3.487, 3.625], ["the", 3.638, 3.7], ["habits", 3.712, 4.1], ["of", 4.112, 4.2], ["the", 4.213, 4.3], ["rich", 4.312, 4.737]]}]}, {"sents": [{"en": "From my great-grandfather, not to have frequented public schools, and to have had good teachers at home,", "zh": "從我曾祖父身上，我學到不必老是往公立學校跑，在家裡請好的老師就好。", "notes": [{"w": "frequented", "m": "常去、頻繁出入", "kk": "/ˋfrikwəntɪd/", "pos": "動詞", "def": "frequent 當動詞用，指常常出入某個場所；比 go to 多了「習慣性、次數多」的意味。", "use": "He frequented the same coffee shop for years.", "useZh": "他好幾年都固定往同一間咖啡店跑。", "why": "frequent 平常多當形容詞（頻繁的），這裡當動詞是比較古雅的用法。", "zhw": "老是往公立學校跑"}], "start": 25.464, "end": 31.089, "ew": [["From", 0.1, 0.338], ["my", 0.35, 0.487], ["great-grandfather", 0.5, 1.512], ["not", 1.762, 1.938], ["to", 1.95, 2.038], ["have", 2.05, 2.225], ["frequented", 2.237, 2.8], ["public", 2.812, 3.15], ["schools", 3.163, 3.688], ["and", 3.875, 3.975], ["to", 3.987, 4.075], ["have", 4.088, 4.237], ["had", 4.25, 4.412], ["good", 4.425, 4.65], ["teachers", 4.662, 5.062], ["at", 5.075, 5.162], ["home", 5.175, 5.625]]}, {"en": "and to know that on such things a man should spend liberally.", "zh": "他也讓我懂得，這種事情該花錢就要大方地花。", "notes": [{"w": "spend liberally", "m": "大方地花錢", "kk": "/ˋlɪbərəlɪ/", "pos": "片語", "def": "liberally 是慷慨地、不吝惜地；跟政治上的 liberal（自由派）同字源，核心都是「不設限」。", "use": "On books, spend liberally.", "useZh": "買書這種事，就大方地花。", "why": "整卷都在講節制，唯獨教育要大方花——對比放在一個副詞上。", "zhw": "大方地花"}], "start": 32.418, "end": 35.243, "ew": [["and", 0.1, 0.263], ["to", 0.275, 0.388], ["know", 0.4, 0.575], ["that", 0.588, 0.775], ["on", 0.787, 0.912], ["such", 0.925, 1.225], ["things", 1.238, 1.475], ["a", 1.488, 1.538], ["man", 1.55, 1.837], ["should", 1.85, 2.013], ["spend", 2.025, 2.35], ["liberally", 2.362, 2.825]]}]}, {"sents": [{"en": "From my governor, to be neither of the green nor of the blue party at the games in the Circus, nor a partisan either of the Parmularius or the Scutarius at the gladiators' fights;", "zh": "從帶我長大的師傅身上，我學到在賽場看比賽不要選邊站——不當綠隊的人，也不當藍隊的人；看角鬥士打鬥，也不偏袒小盾派或大盾派。", "notes": [{"w": "partisan", "m": "死忠支持者", "kk": "/ˋpɑrtəzn/", "pos": "名詞", "def": "狂熱偏袒某一方的人，帶「不問是非、先站隊」的貶義；現代講政治對立常用 partisan politics。", "use": "Try not to be a partisan before hearing both sides.", "useZh": "兩邊都還沒聽完，先別急著當某一方的死忠。", "why": "兩千年前的賽車和角鬥就有「粉絲站隊文化」，作者從小被教不要捲進去。", "zhw": "偏袒"}], "start": 36.564, "end": 46.264, "ew": [["From", 0.1, 0.35], ["my", 0.362, 0.5], ["governor", 0.512, 0.925], ["to", 1.125, 1.212], ["be", 1.225, 1.35], ["neither", 1.363, 1.725], ["of", 1.738, 1.825], ["the", 1.837, 1.938], ["green", 1.95, 2.288], ["nor", 2.3, 2.525], ["of", 2.538, 2.612], ["the", 2.625, 2.725], ["blue", 2.737, 3.025], ["party", 3.038, 3.475], ["at", 3.487, 3.55], ["the", 3.562, 3.65], ["games", 3.663, 4.013], ["in", 4.025, 4.112], ["the", 4.125, 4.2], ["Circus", 4.213, 4.737], ["nor", 4.963, 5.213], ["a", 5.225, 5.287], ["partisan", 5.3, 5.925], ["either", 5.938, 6.237], ["of", 6.25, 6.338], ["the", 6.35, 6.425], ["Parmularius", 6.438, 7.287], ["or", 7.3, 7.388], ["the", 7.4, 7.5], ["Scutarius", 7.513, 8.213], ["at", 8.225, 8.312], ["the", 8.325, 8.412], ["gladiators'", 8.425, 9.1], ["fights", 9.113, 9.7]]}, {"en": "from him too I learned endurance of labour, and to want little, and to work with my own hands,", "zh": "他還教我要能吃苦耐勞，慾望要少，凡事自己動手做。", "notes": [{"w": "endurance", "m": "耐力、能吃苦", "kk": "/ɪnˋdjʊrəns/", "pos": "名詞", "def": "長時間承受辛苦而不垮掉的能力；動詞是 endure，運動上的耐力訓練就叫 endurance training。", "use": "Long hikes build endurance.", "useZh": "長程健行能練出耐力。", "why": "endurance of labour 直譯是「對勞動的忍耐」——吃苦被當成一種可以練的能力。", "zhw": "吃苦耐勞"}, {"w": "to want little", "m": "慾望要少", "kk": "/wɑnt/", "pos": "片語", "def": "want 這裡取「缺、需要」的古義，to want little 是「需要的東西很少」，不是「不想要」。", "use": "He lives simply and wants little.", "useZh": "他過得簡單，需要的東西很少。", "why": "斯多噶的核心用三個字講完：需要得少，就自由得多。", "zhw": "慾望要少"}], "start": 47.598, "end": 52.798, "ew": [["from", 0.1, 0.362], ["him", 0.375, 0.55], ["too", 0.562, 0.775], ["I", 0.787, 0.912], ["learned", 0.925, 1.238], ["endurance", 1.25, 1.775], ["of", 1.788, 1.863], ["labour", 1.875, 2.3], ["and", 2.513, 2.625], ["to", 2.638, 2.737], ["want", 2.75, 2.962], ["little", 2.975, 3.288], ["and", 3.513, 3.6], ["to", 3.612, 3.712], ["work", 3.725, 4.037], ["with", 4.05, 4.162], ["my", 4.175, 4.4], ["own", 4.412, 4.612], ["hands", 4.625, 5.2]]}, {"en": "and not to meddle with other people's affairs, and not to be ready to listen to slander.", "zh": "不要多管別人的閒事，也不要一聽到人家講壞話就照單全收。", "notes": [{"w": "meddle with", "m": "插手、多管", "kk": "/ˋmɛdl/", "pos": "片語", "def": "介入跟自己無關的事，貶義；比 get involved 多了「不受歡迎地亂插手」的意味。", "use": "Don't meddle with your colleagues' projects.", "useZh": "別多管同事的案子。", "why": "管好自己是這整卷反覆出現的主題，這裡是它最日常的版本。", "zhw": "多管"}, {"w": "slander", "m": "毀謗、壞話", "kk": "/ˋslændɚ/", "pos": "名詞", "def": "口頭上的不實中傷；法律上跟書面毀謗（libel）相對，日常泛指講人壞話。", "use": "He refused to spread slander about his rival.", "useZh": "他拒絕散播對手的壞話。", "why": "注意教的不是「不要講」而是「不要輕易聽」——聽的人也有責任。", "zhw": "壞話"}], "start": 54.12, "end": 58.482, "ew": [["and", 0.1, 0.3], ["not", 0.312, 0.487], ["to", 0.5, 0.575], ["meddle", 0.588, 0.912], ["with", 0.925, 1.05], ["other", 1.062, 1.25], ["people's", 1.262, 1.613], ["affairs", 1.625, 2.163], ["and", 2.375, 2.5], ["not", 2.513, 2.688], ["to", 2.7, 2.763], ["be", 2.775, 2.862], ["ready", 2.875, 3.163], ["to", 3.175, 3.288], ["listen", 3.3, 3.612], ["to", 3.625, 3.712], ["slander", 3.725, 4.362]]}]}, {"sents": [{"en": "From Diognetus, not to busy myself about trifling things,", "zh": "從迪奧格內圖斯身上，我學到不要把心思花在雞毛蒜皮的小事上。", "notes": [{"w": "trifling", "m": "微不足道的", "kk": "/ˋtraɪflɪŋ/", "pos": "形容詞", "def": "小到不值得花時間的；名詞 trifle 是小事、瑣事，a trifle 也可當「一點點」用。", "use": "Don't lose sleep over trifling matters.", "useZh": "別為雞毛蒜皮的小事睡不著。", "why": "皇帝的時間管理第一課：先認出什麼是 trifling。", "zhw": "雞毛蒜皮"}], "start": 59.802, "end": 63.69, "ew": [["From", 0.1, 0.375], ["Diognetus", 0.388, 1.2], ["not", 1.4, 1.6], ["to", 1.613, 1.7], ["busy", 1.712, 1.975], ["myself", 1.988, 2.475], ["about", 2.487, 2.75], ["trifling", 2.763, 3.275], ["things", 3.288, 3.888]]}, {"en": "and not to give credit to what was said by miracle-workers and jugglers about incantations and the driving away of daemons and such things;", "zh": "那些變戲法的、耍把戲的人講什麼咒語、什麼驅魔趕鬼，我學會不去信這一套。", "notes": [{"w": "give credit to", "m": "相信、當真", "kk": "/ˋkrɛdɪt/", "pos": "片語", "def": "credit 這裡是「信任」，give credit to 就是把某人的話當真；跟「給予肯定」的用法同源。", "use": "I don't give credit to online rumors.", "useZh": "網路謠言我不當真。", "why": "兩千年前的「不信偏方、不信怪力亂神」——理性訓練從小開始。", "zhw": "信"}, {"w": "incantations", "m": "咒語", "kk": "/ˏɪnkænˋteʃənz/", "pos": "名詞", "def": "唸出來據稱有魔力的一串字句；字根 cant- 跟 chant（吟唱）同源。", "use": "The play opens with a witch's incantation.", "useZh": "那齣戲以女巫的咒語開場。", "why": "跟 jugglers（耍把戲的）擺在一起，咒語被歸進表演雜耍那一類——立場很清楚。", "zhw": "咒語"}], "start": 65.004, "end": 72.041, "ew": [["and", 0.1, 0.3], ["not", 0.312, 0.487], ["to", 0.5, 0.575], ["give", 0.588, 0.762], ["credit", 0.775, 1.087], ["to", 1.1, 1.175], ["what", 1.188, 1.387], ["was", 1.4, 1.562], ["said", 1.575, 1.837], ["by", 1.85, 1.975], ["miracle-workers", 1.988, 2.85], ["and", 2.862, 3.0], ["jugglers", 3.013, 3.425], ["about", 3.438, 3.737], ["incantations", 3.75, 4.588], ["and", 4.6, 4.688], ["the", 4.7, 4.8], ["driving", 4.812, 5.237], ["away", 5.25, 5.475], ["of", 5.487, 5.612], ["daemons", 5.625, 6.088], ["and", 6.1, 6.213], ["such", 6.225, 6.5], ["things", 6.513, 7.037]]}, {"en": "and not to breed quails for fighting, nor to give myself up passionately to such things;", "zh": "他也讓我不去養鬥鵪鶉，不要沉迷在那種東西裡面。", "notes": [{"w": "give myself up to", "m": "沉迷於", "kk": "/ˋpæʃənɪtlɪ/", "pos": "片語", "def": "give oneself up to 是整個人投進去、任由某事吞掉自己；加上 passionately 就是「狂熱地沉迷」。", "use": "He gave himself up to gaming for a whole year.", "useZh": "他整整一年沉迷在電玩裡。", "why": "鬥鵪鶉是當時的賭博娛樂；問題不在鵪鶉，在「整個人陷進去」。", "zhw": "沉迷"}], "start": 73.374, "end": 78.186, "ew": [["and", 0.1, 0.3], ["not", 0.312, 0.475], ["to", 0.487, 0.575], ["breed", 0.588, 0.887], ["quails", 0.9, 1.337], ["for", 1.35, 1.438], ["fighting", 1.45, 1.913], ["nor", 2.138, 2.337], ["to", 2.35, 2.487], ["give", 2.5, 2.675], ["myself", 2.688, 3.163], ["up", 3.175, 3.325], ["passionately", 3.337, 3.85], ["to", 3.862, 3.975], ["such", 3.987, 4.275], ["things", 4.287, 4.812]]}, {"en": "and to endure freedom of speech; and to have become intimate with philosophy;", "zh": "他教我要受得了別人的直言，也讓我開始親近哲學。", "notes": [{"w": "endure freedom of speech", "m": "受得了別人直言", "kk": "/ɪnˋdjʊr/", "pos": "片語", "def": "這裡的 freedom of speech 不是現代的「言論自由」，是「別人有話直說」；endure 是你要吞得下去。", "use": "A good leader endures freedom of speech from the team.", "useZh": "好的主管受得了團隊有話直說。", "why": "對未來的皇帝，這是最難的一課：權力越大，越少人敢對你說真話。", "zhw": "直言"}], "start": 79.512, "end": 83.337, "ew": [["and", 0.1, 0.263], ["to", 0.275, 0.4], ["endure", 0.412, 0.812], ["freedom", 0.825, 1.238], ["of", 1.25, 1.325], ["speech", 1.337, 1.725], ["and", 1.988, 2.062], ["to", 2.075, 2.15], ["have", 2.163, 2.312], ["become", 2.325, 2.638], ["intimate", 2.65, 3.05], ["with", 3.062, 3.188], ["philosophy", 3.2, 3.825]]}, {"en": "and to have been a hearer, first of Bacchius, then of Tandasis and Marcianus;", "zh": "我先後跟過幾位老師聽課——先是巴奇烏斯，再來是坦達西斯跟馬奇亞努斯。", "notes": [{"w": "hearer", "m": "聽講的學生", "kk": "/ˋhɪrɚ/", "pos": "名詞", "def": "古代哲學學校的「旁聽生、門生」，坐在老師跟前聽講的人；比 student 更強調「用耳朵學」。", "use": "He was a hearer of the old master for three years.", "useZh": "他在老師傅門下聽了三年課。", "why": "古代哲學是用聽的、用問的，不是用讀的——hearer 一個字就把學習方式講出來。", "zhw": "聽課"}], "start": 84.666, "end": 89.179, "ew": [["and", 0.1, 0.263], ["to", 0.275, 0.35], ["have", 0.362, 0.5], ["been", 0.512, 0.637], ["a", 0.65, 0.688], ["hearer", 0.7, 1.2], ["first", 1.363, 1.663], ["of", 1.675, 1.775], ["Bacchius", 1.788, 2.388], ["then", 2.6, 2.763], ["of", 2.775, 2.862], ["Tandasis", 2.875, 3.487], ["and", 3.5, 3.625], ["Marcianus", 3.638, 4.513]]}, {"en": "and to have written dialogues in my youth; and to have desired a plank bed and skin, and whatever else of the kind belongs to the Grecian discipline.", "zh": "我年輕的時候寫過對話錄，也開始嚮往睡木板床、蓋獸皮這種日子——這些都是希臘式修行的一部分。", "notes": [{"w": "plank bed", "m": "木板床", "kk": "/plæŋk/", "pos": "片語", "def": "plank 是厚木板；plank bed 就是不加軟墊的板床，是刻意吃苦的修行配備。健身的「平板支撐」也叫 plank。", "use": "The monks sleep on plank beds.", "useZh": "僧侶們睡木板床。", "why": "一個少年「嚮往」睡木板床——這股憧憬比任何大道理都能說明他是誰。", "zhw": "木板床"}, {"w": "discipline", "m": "修行、紀律", "kk": "/ˋdɪsəplɪn/", "pos": "名詞", "def": "有規矩的自我訓練；也指學科（a discipline）。這裡的 Grecian discipline 指希臘哲學家那套簡樸的修行方式。", "use": "Writing every day takes discipline.", "useZh": "每天寫作需要紀律。", "why": "discipline 在本卷出現多次——對斯多噶而言，哲學不是學說，是一套要「練」的生活。", "zhw": "修行"}], "start": 90.492, "end": 97.867, "ew": [["and", 0.1, 0.275], ["to", 0.287, 0.362], ["have", 0.375, 0.562], ["written", 0.575, 0.875], ["dialogues", 0.887, 1.413], ["in", 1.425, 1.538], ["my", 1.55, 1.688], ["youth", 1.7, 2.112], ["and", 2.312, 2.388], ["to", 2.4, 2.475], ["have", 2.487, 2.625], ["desired", 2.638, 3.062], ["a", 3.075, 3.125], ["plank", 3.138, 3.525], ["bed", 3.538, 3.75], ["and", 3.763, 3.875], ["skin", 3.888, 4.287], ["and", 4.537, 4.65], ["whatever", 4.662, 5.075], ["else", 5.088, 5.312], ["of", 5.325, 5.4], ["the", 5.412, 5.5], ["kind", 5.513, 5.825], ["belongs", 5.838, 6.188], ["to", 6.2, 6.287], ["the", 6.3, 6.4], ["Grecian", 6.412, 6.825], ["discipline", 6.838, 7.375]]}]}, {"sents": [{"en": "From Rusticus I received the impression that my character required improvement and discipline;", "zh": "從魯斯提庫斯身上，我才意識到自己的品格還需要改進、需要磨練。", "notes": [{"w": "received the impression", "m": "深刻體悟到", "kk": "/ɪmˋprɛʃən/", "pos": "片語", "def": "impression 是壓印進心裡的認知；receive the impression 比 realize 更被動、更深——像被蓋了一個印。", "use": "From her feedback I received the impression that I had much to learn.", "useZh": "從她的回饋裡，我深刻體悟到自己還有很多要學。", "why": "整卷唯一一句「我被點醒」——別人給他知識，魯斯提庫斯給他自知之明。", "zhw": "意識到"}], "start": 99.198, "end": 103.823, "ew": [["From", 0.1, 0.362], ["Rusticus", 0.375, 0.887], ["I", 0.9, 1.025], ["received", 1.038, 1.488], ["the", 1.5, 1.587], ["impression", 1.6, 2.075], ["that", 2.087, 2.212], ["my", 2.225, 2.362], ["character", 2.375, 2.837], ["required", 2.85, 3.35], ["improvement", 3.362, 3.925], ["and", 3.938, 4.013], ["discipline", 4.025, 4.625]]}, {"en": "and from him I learned not to be led astray to sophistic emulation, nor to writing on speculative matters, nor to delivering little hortatory orations,", "zh": "他讓我不要走偏——不要去跟人比誰的詭辯厲害，不要寫空談玄理的東西，也不要動不動就發表一小段勸世的演講。", "notes": [{"w": "sophistic", "m": "詭辯的", "kk": "/səˋfɪstɪk/", "pos": "形容詞", "def": "聽起來頭頭是道、其實只為贏不為真的論證方式；源自古希臘的詭辯學派（Sophists）。", "use": "His argument sounds clever but is merely sophistic.", "useZh": "他的論點聽起來聰明，其實只是詭辯。", "why": "當時的知識圈流行鬥嘴炫技；魯斯提庫斯教他分清「講贏」和「講對」。", "zhw": "詭辯"}, {"w": "hortatory", "m": "勸誡式的", "kk": "/ˋhɔrtəˏtorɪ/", "pos": "形容詞", "def": "以勸勉、訓話為目的的（言論）；字根同 exhort（力勸）。是個書卷味很重的字。", "use": "The coach's hortatory speech got old fast.", "useZh": "教練那套訓話式的演講很快就讓人膩了。", "why": "「動不動就勸世」是一種表演——真正的修行不需要觀眾，下一句就講到這個。", "zhw": "勸世"}], "start": 105.144, "end": 113.144, "ew": [["and", 0.1, 0.263], ["from", 0.275, 0.438], ["him", 0.45, 0.613], ["I", 0.625, 0.713], ["learned", 0.725, 1.0], ["not", 1.012, 1.175], ["to", 1.188, 1.25], ["be", 1.262, 1.363], ["led", 1.375, 1.575], ["astray", 1.587, 1.925], ["to", 1.938, 2.062], ["sophistic", 2.075, 2.575], ["emulation", 2.587, 3.175], ["nor", 3.462, 3.638], ["to", 3.65, 3.788], ["writing", 3.8, 4.188], ["on", 4.2, 4.312], ["speculative", 4.325, 4.912], ["matters", 4.925, 5.4], ["nor", 5.688, 5.9], ["to", 5.912, 6.037], ["delivering", 6.05, 6.475], ["little", 6.487, 6.763], ["hortatory", 6.775, 7.3], ["orations", 7.312, 8.0]]}, {"en": "nor to showing myself off as a man who practises much discipline, or does benevolent acts in order to make a display;", "zh": "他讓我不要裝出一副很有修養的樣子，也不要為了給人看才去做好事。", "notes": [{"w": "make a display", "m": "做給人看", "kk": "/dɪˋsple/", "pos": "片語", "def": "display 是展示；make a display 就是刻意演給別人看，貶義。", "use": "He helps quietly, never to make a display.", "useZh": "他都默默幫忙，從不做給人看。", "why": "好事一旦是演的，就不是好事了——這句是整卷對「表演型人格」最直接的一刀。", "zhw": "給人看"}], "start": 114.474, "end": 120.711, "ew": [["nor", 0.1, 0.338], ["to", 0.35, 0.475], ["showing", 0.487, 0.812], ["myself", 0.825, 1.337], ["off", 1.35, 1.538], ["as", 1.55, 1.688], ["a", 1.7, 1.762], ["man", 1.775, 2.087], ["who", 2.1, 2.237], ["practises", 2.25, 2.8], ["much", 2.812, 3.087], ["discipline", 3.1, 3.625], ["or", 3.75, 3.85], ["does", 3.862, 4.088], ["benevolent", 4.1, 4.588], ["acts", 4.6, 4.862], ["in", 4.875, 5.0], ["order", 5.013, 5.287], ["to", 5.3, 5.4], ["make", 5.412, 5.6], ["a", 5.612, 5.662], ["display", 5.675, 6.237]]}, {"en": "and to abstain from rhetoric, and poetry, and fine writing;", "zh": "他要我遠離華麗的修辭、詩歌，還有那些漂亮的文章。", "notes": [{"w": "abstain from", "m": "戒除、遠離", "kk": "/əbˋsten/", "pos": "片語", "def": "主動克制自己不去碰；名詞是 abstinence（本卷第三句剛出現過），投票棄權也用這個字。", "use": "He abstained from social media for a month.", "useZh": "他戒了一個月的社群媒體。", "why": "作者年輕時熱愛修辭學，老師要他戒掉——對他來說這是真的「戒」。", "zhw": "遠離"}], "start": 122.028, "end": 125.865, "ew": [["and", 0.1, 0.275], ["to", 0.287, 0.4], ["abstain", 0.412, 0.963], ["from", 0.975, 1.15], ["rhetoric", 1.163, 1.637], ["and", 1.875, 1.988], ["poetry", 2.0, 2.562], ["and", 2.775, 2.9], ["fine", 2.913, 3.275], ["writing", 3.288, 3.837]]}, {"en": "and not to walk about in the house in my outdoor dress, nor to do other things of the kind;", "zh": "他教我不要穿著外出服在家裡走來走去，這一類的事情都別做。", "notes": [{"w": "outdoor dress", "m": "外出服", "kk": "/ˋaʊtˏdor/", "pos": "片語", "def": "見客、出門用的正式衣著；羅馬語境指 toga 那類場面服裝。", "use": "He changed out of his outdoor dress the moment he got home.", "useZh": "他一到家就把外出服換掉。", "why": "在家還穿著場面服裝＝隨時在「上場」。連穿衣都要分清楚哪些是演的。", "zhw": "外出服"}], "start": 127.182, "end": 131.919, "ew": [["and", 0.1, 0.312], ["not", 0.325, 0.487], ["to", 0.5, 0.575], ["walk", 0.588, 0.838], ["about", 0.85, 1.137], ["in", 1.15, 1.225], ["the", 1.238, 1.3], ["house", 1.312, 1.625], ["in", 1.637, 1.738], ["my", 1.75, 1.962], ["outdoor", 1.975, 2.3], ["dress", 2.312, 2.725], ["nor", 2.95, 3.15], ["to", 3.163, 3.3], ["do", 3.312, 3.5], ["other", 3.513, 3.688], ["things", 3.7, 4.013], ["of", 4.025, 4.088], ["the", 4.1, 4.175], ["kind", 4.188, 4.737]]}, {"en": "and to write my letters with simplicity, like the letter which Rusticus wrote from Sinuessa to my mother;", "zh": "他要我寫信樸實一點，就像他從西努薩寫給我母親的那封信那樣。", "notes": [{"w": "simplicity", "m": "樸實、簡單", "kk": "/sɪmˋplɪsətɪ/", "pos": "名詞", "def": "不加修飾的簡單；with simplicity 當副詞片語用，就是「樸實地」。", "use": "She explains hard ideas with simplicity.", "useZh": "她能把難的概念講得很樸實。", "why": "標準不是一條規則，而是一封具體的信——「像那封信那樣」比任何理論都清楚。", "zhw": "樸實"}], "start": 133.248, "end": 138.386, "ew": [["and", 0.1, 0.25], ["to", 0.263, 0.362], ["write", 0.375, 0.637], ["my", 0.65, 0.787], ["letters", 0.8, 1.188], ["with", 1.2, 1.325], ["simplicity", 1.337, 1.913], ["like", 2.125, 2.275], ["the", 2.288, 2.362], ["letter", 2.375, 2.65], ["which", 2.663, 2.85], ["Rusticus", 2.862, 3.35], ["wrote", 3.362, 3.625], ["from", 3.638, 3.812], ["Sinuessa", 3.825, 4.425], ["to", 4.438, 4.537], ["my", 4.55, 4.713], ["mother", 4.725, 5.138]]}, {"en": "and with respect to those who have offended me by words, or done me wrong, to be easily disposed to be pacified and reconciled, as soon as they have shown a readiness to be reconciled;", "zh": "要是有人用言語冒犯我、或是做了對不起我的事，只要對方願意和解，我就該很容易消氣、跟人和好。", "notes": [{"w": "pacified", "m": "消氣、被平息", "kk": "/ˋpæsəˏfaɪd/", "pos": "動詞", "def": "pacify 是使平靜、平息怒氣；字根 pac- 就是 peace，安撫嬰兒的奶嘴叫 pacifier。", "use": "A sincere apology quickly pacified her.", "useZh": "一句真誠的道歉很快讓她消了氣。", "why": "注意順序：對方先伸手，你就要接——氣可以有，但不能捨不得放。", "zhw": "消氣"}, {"w": "reconciled", "m": "和好", "kk": "/ˋrɛkənˏsaɪld/", "pos": "動詞", "def": "reconcile 是修復關係、重歸於好；也用在「調和」兩個矛盾的事物，會計對帳也叫 reconcile。", "use": "The brothers reconciled after years of silence.", "useZh": "兄弟倆冷戰多年後和好了。", "why": "一句話裡出現兩次 reconciled——條件和結果都是它，和好這件事沒有討價還價。", "zhw": "和好"}], "start": 139.698, "end": 149.348, "ew": [["and", 0.1, 0.3], ["with", 0.312, 0.45], ["respect", 0.463, 0.825], ["to", 0.838, 0.9], ["those", 0.912, 1.175], ["who", 1.188, 1.3], ["have", 1.312, 1.45], ["offended", 1.462, 1.85], ["me", 1.863, 1.975], ["by", 1.988, 2.163], ["words", 2.175, 2.688], ["or", 2.925, 3.05], ["done", 3.062, 3.312], ["me", 3.325, 3.413], ["wrong", 3.425, 3.775], ["to", 3.95, 4.025], ["be", 4.037, 4.162], ["easily", 4.175, 4.612], ["disposed", 4.625, 5.125], ["to", 5.138, 5.2], ["be", 5.213, 5.325], ["pacified", 5.338, 5.963], ["and", 5.975, 6.1], ["reconciled", 6.112, 6.825], ["as", 7.037, 7.162], ["soon", 7.175, 7.425], ["as", 7.438, 7.537], ["they", 7.55, 7.65], ["have", 7.662, 7.8], ["shown", 7.812, 8.088], ["a", 8.1, 8.137], ["readiness", 8.15, 8.512], ["to", 8.525, 8.625], ["be", 8.637, 8.738], ["reconciled", 8.75, 9.65]]}, {"en": "and to read carefully, and not to be satisfied with a superficial understanding of a book; nor hastily to give my assent to those who talk overmuch;", "zh": "他要我讀書要仔細，不要讀個大概就滿足；別人話講得太多，也不要急著點頭同意。", "notes": [{"w": "superficial", "m": "表面的、粗淺的", "kk": "/ˏsupɚˋfɪʃəl/", "pos": "形容詞", "def": "只停在表層、沒有深入的；字面就是 super（上面）＋ face（表面）。可形容理解、傷口、人。", "use": "A superficial reading misses the point of this book.", "useZh": "讀個大概，就會錯過這本書真正要講的。", "why": "你現在用兩種深度聽同一本書——這句正好是「速讀跟精讀差在哪」的兩千年前版本。", "zhw": "讀個大概"}, {"w": "assent", "m": "同意、首肯", "kk": "/əˋsɛnt/", "pos": "名詞", "def": "正式的同意；give assent to 就是點頭認可。跟 agree 比起來更書面、更鄭重。", "use": "Don't give your assent before reading the contract.", "useZh": "合約沒讀完，先別點頭。", "why": "話多的人自帶說服力，斯多噶把「不急著同意」當成一種要練的肌肉。", "zhw": "點頭同意"}], "start": 150.66, "end": 158.385, "ew": [["and", 0.1, 0.275], ["to", 0.287, 0.4], ["read", 0.412, 0.675], ["carefully", 0.688, 1.238], ["and", 1.438, 1.562], ["not", 1.575, 1.738], ["to", 1.75, 1.8], ["be", 1.812, 1.913], ["satisfied", 1.925, 2.575], ["with", 2.587, 2.712], ["a", 2.725, 2.775], ["superficial", 2.788, 3.425], ["understanding", 3.438, 4.05], ["of", 4.062, 4.125], ["a", 4.138, 4.213], ["book", 4.225, 4.513], ["nor", 4.75, 4.925], ["hastily", 4.938, 5.412], ["to", 5.425, 5.537], ["give", 5.55, 5.713], ["my", 5.725, 5.925], ["assent", 5.938, 6.275], ["to", 6.287, 6.35], ["those", 6.362, 6.625], ["who", 6.638, 6.763], ["talk", 6.775, 7.1], ["overmuch", 7.112, 7.725]]}, {"en": "and I am indebted to him for being acquainted with the discourses of Epictetus, which he communicated to me out of his own collection.", "zh": "我還要感謝他——是他把自己收藏的愛比克泰德講稿拿給我看，我才認識這些內容。", "notes": [{"w": "indebted", "m": "感激、受惠於", "kk": "/ɪnˋdɛtɪd/", "pos": "形容詞", "def": "字面是「欠債的」（debt），引申為受了恩惠、心懷感激；be indebted to sb for sth 是固定句型。", "use": "I am indebted to my first editor for everything.", "useZh": "我對第一位編輯感激不盡。", "why": "一本改變他一生的書，是老師從私人收藏裡拿出來的——這筆「債」他記了一輩子。", "zhw": "感謝"}, {"w": "discourses", "m": "講稿、論說", "kk": "/ˋdɪskorsɪz/", "pos": "名詞", "def": "有系統的談話或論述紀錄；愛比克泰德的《語錄》英譯就叫 Discourses——是學生聽課的筆記。", "use": "His discourses were collected by his students.", "useZh": "他的講稿是學生們整理下來的。", "why": "本書架上那本《愛比克泰德語錄》，就是這裡講的這份講稿——兩本書在這句相遇。", "zhw": "講稿"}], "start": 159.702, "end": 166.127, "ew": [["and", 0.1, 0.3], ["I", 0.312, 0.425], ["am", 0.438, 0.537], ["indebted", 0.55, 0.938], ["to", 0.95, 1.012], ["him", 1.025, 1.212], ["for", 1.225, 1.325], ["being", 1.337, 1.587], ["acquainted", 1.6, 2.1], ["with", 2.112, 2.225], ["the", 2.237, 2.312], ["discourses", 2.325, 2.888], ["of", 2.9, 2.975], ["Epictetus", 2.987, 3.712], ["which", 3.925, 4.088], ["he", 4.1, 4.2], ["communicated", 4.213, 4.95], ["to", 4.963, 5.037], ["me", 5.05, 5.188], ["out", 5.2, 5.375], ["of", 5.388, 5.463], ["his", 5.475, 5.625], ["own", 5.638, 5.812], ["collection", 5.825, 6.425]]}]}, {"sents": [{"en": "From Apollonius I learned freedom of will and undeviating steadiness of purpose;", "zh": "從阿波羅尼烏斯身上，我學到意志的自由，還有立定目標之後就毫不動搖的堅定。", "notes": [{"w": "undeviating", "m": "毫不偏離的", "kk": "/ʌnˋdivɪˏetɪŋ/", "pos": "形容詞", "def": "deviate 是偏離路線，undeviating 就是從不偏離、筆直到底的。", "use": "She pursued the goal with undeviating focus.", "useZh": "她毫不動搖地朝目標前進。", "why": "不是「很少偏離」，是「不偏離」——un- 一個字首把程度鎖死。", "zhw": "毫不動搖"}], "start": 167.448, "end": 171.748, "ew": [["From", 0.1, 0.375], ["Apollonius", 0.388, 1.012], ["I", 1.025, 1.15], ["learned", 1.163, 1.512], ["freedom", 1.525, 1.913], ["of", 1.925, 1.988], ["will", 2.0, 2.225], ["and", 2.237, 2.325], ["undeviating", 2.337, 3.1], ["steadiness", 3.112, 3.538], ["of", 3.55, 3.65], ["purpose", 3.663, 4.3]]}, {"en": "and to look to nothing else, not even for a moment, except to reason;", "zh": "他讓我懂得，除了理性以外，什麼都不該去看重，連一刻都不行。", "notes": [{"w": "look to", "m": "看重、指望", "kk": "/lʊk/", "pos": "片語", "def": "把目光放在某處，引申為依靠、以…為依歸；look to reason 就是凡事回到理性來判斷。", "use": "In a crisis, look to the facts first.", "useZh": "遇到危機，先回到事實。", "why": "「連一刻都不行」——斯多噶的理性不是原則，是每一秒的操作方式。", "zhw": "看重"}], "start": 173.082, "end": 177.007, "ew": [["and", 0.1, 0.275], ["to", 0.287, 0.388], ["look", 0.4, 0.55], ["to", 0.562, 0.637], ["nothing", 0.65, 1.062], ["else", 1.075, 1.425], ["not", 1.625, 1.85], ["even", 1.863, 2.087], ["for", 2.1, 2.237], ["a", 2.25, 2.312], ["moment", 2.325, 2.763], ["except", 2.925, 3.325], ["to", 3.337, 3.413], ["reason", 3.425, 3.925]]}, {"en": "and to be always the same, in sharp pains, on the occasion of the loss of a child, and in long illness;", "zh": "他教我不管碰到什麼處境都要保持一樣——劇烈的疼痛、失去孩子的時候，還是久病纏身的日子。", "notes": [{"w": "on the occasion of", "m": "在…的時候", "kk": "/əˋkeʒən/", "pos": "片語", "def": "正式的時間片語，指某個特定事件發生之際；比 when 更莊重，常見於典禮或重大事件。", "use": "He stayed calm on the occasion of the storm.", "useZh": "暴風雨來的時候，他保持鎮定。", "why": "喪子這種事用最平靜的片語帶過——文字本身就在示範「保持一樣」。", "zhw": "的時候"}], "start": 178.332, "end": 183.97, "ew": [["and", 0.1, 0.275], ["to", 0.287, 0.362], ["be", 0.375, 0.487], ["always", 0.5, 0.863], ["the", 0.875, 0.975], ["same", 0.988, 1.337], ["in", 1.525, 1.625], ["sharp", 1.637, 1.962], ["pains", 1.975, 2.413], ["on", 2.625, 2.763], ["the", 2.775, 2.862], ["occasion", 2.875, 3.275], ["of", 3.288, 3.35], ["the", 3.362, 3.438], ["loss", 3.45, 3.688], ["of", 3.7, 3.775], ["a", 3.788, 3.85], ["child", 3.862, 4.362], ["and", 4.575, 4.7], ["in", 4.713, 4.838], ["long", 4.85, 5.112], ["illness", 5.125, 5.638]]}, {"en": "and to see clearly in a living example that the same man can be both most resolute and yielding, and not peevish in giving his instruction;", "zh": "我從一個活生生的例子清楚看到，同一個人可以既非常剛毅、又願意退讓，教導別人的時候也不會不耐煩。", "notes": [{"w": "resolute", "m": "剛毅、堅決", "kk": "/ˋrɛzəˏlut/", "pos": "形容詞", "def": "下了決心就不動搖的；名詞是 resolution——新年新希望的「決心」就是這個字。", "use": "She was resolute in refusing the shortcut.", "useZh": "她堅決不走捷徑。", "why": "剛毅（resolute）與退讓（yielding）是反義詞，卻同時放在一個人身上——這句的重點就是這個矛盾。", "zhw": "剛毅"}, {"w": "peevish", "m": "易怒、不耐煩的", "kk": "/ˋpivɪʃ/", "pos": "形容詞", "def": "為小事發脾氣、煩躁易怒的；形容那種「一點就炸」的壞脾氣。", "use": "Lack of sleep makes me peevish.", "useZh": "睡不夠我就容易不耐煩。", "why": "教人最難的不是懂，是不煩——阿波羅尼烏斯連這個都做到了。", "zhw": "不耐煩"}], "start": 185.286, "end": 192.111, "ew": [["and", 0.1, 0.287], ["to", 0.3, 0.4], ["see", 0.412, 0.625], ["clearly", 0.637, 1.025], ["in", 1.038, 1.125], ["a", 1.137, 1.175], ["living", 1.188, 1.475], ["example", 1.488, 1.95], ["that", 1.962, 2.062], ["the", 2.075, 2.15], ["same", 2.163, 2.425], ["man", 2.438, 2.675], ["can", 2.688, 2.825], ["be", 2.837, 2.938], ["both", 2.95, 3.25], ["most", 3.263, 3.525], ["resolute", 3.538, 3.987], ["and", 4.0, 4.088], ["yielding", 4.1, 4.55], ["and", 4.838, 4.95], ["not", 4.963, 5.162], ["peevish", 5.175, 5.562], ["in", 5.575, 5.675], ["giving", 5.688, 6.0], ["his", 6.013, 6.138], ["instruction", 6.15, 6.825]]}, {"en": "and to have had before my eyes a man who clearly considered his experience and his skill in expounding philosophical principles as the smallest of his merits;", "zh": "我親眼見到一個人，他明明很有經驗、很擅長講解哲學道理，卻把這些看成自己最不值一提的長處。", "notes": [{"w": "expounding", "m": "講解、闡述", "kk": "/ɪkˋspaʊndɪŋ/", "pos": "動詞", "def": "expound 是把道理有系統地講清楚；比 explain 更正式，對象通常是學說、理論、經典。", "use": "He spent an hour expounding his theory.", "useZh": "他花了一小時闡述他的理論。", "why": "最會講的人最不把「會講」當回事——因為斯多噶的重點是活出來，不是講出來。", "zhw": "講解"}, {"w": "merits", "m": "長處、優點", "kk": "/ˋmɛrɪts/", "pos": "名詞", "def": "值得稱讚的優點或功績；judge on merit 是「看實力不看關係」。", "use": "Judge the plan on its merits.", "useZh": "就這個計畫本身的優點來評斷它。", "why": "把最亮眼的本事排在自己優點的最後一名——謙遜到這個程度是本卷的招牌。", "zhw": "長處"}], "start": 193.44, "end": 201.128, "ew": [["and", 0.1, 0.275], ["to", 0.287, 0.362], ["have", 0.375, 0.512], ["had", 0.525, 0.713], ["before", 0.725, 1.025], ["my", 1.038, 1.262], ["eyes", 1.275, 1.45], ["a", 1.462, 1.525], ["man", 1.538, 1.863], ["who", 1.875, 2.0], ["clearly", 2.013, 2.388], ["considered", 2.4, 2.875], ["his", 2.888, 3.025], ["experience", 3.038, 3.663], ["and", 3.675, 3.763], ["his", 3.775, 3.95], ["skill", 3.962, 4.237], ["in", 4.25, 4.338], ["expounding", 4.35, 4.9], ["philosophical", 4.912, 5.575], ["principles", 5.588, 6.175], ["as", 6.188, 6.312], ["the", 6.325, 6.425], ["smallest", 6.438, 6.925], ["of", 6.938, 7.013], ["his", 7.025, 7.175], ["merits", 7.188, 7.688]]}, {"en": "and from him I learned how to receive from friends what are esteemed favours, without being either humbled by them or letting them pass unnoticed.", "zh": "我還從他身上學到，朋友給我好處、給我恩惠的時候，我該怎麼接受——既不會因此覺得矮人一截，也不會把人家的好意當作沒看見。", "notes": [{"w": "esteemed", "m": "被看重的", "kk": "/əˋstimd/", "pos": "形容詞", "def": "esteem 是敬重、高估價值；esteemed favours 指「一般人眼中的大人情」。自尊心的英文就是 self-esteem。", "use": "She is an esteemed guest in this house.", "useZh": "她是這個家非常敬重的客人。", "why": "「一般人眼中的」大人情——一個分詞悄悄拉開了世俗眼光和自己判斷的距離。", "zhw": "恩惠"}, {"w": "humbled", "m": "覺得矮人一截", "kk": "/ˋhʌmbld/", "pos": "動詞", "def": "humble 當動詞是使謙卑、使自覺渺小；被幫助後那種「欠了人、抬不起頭」的感覺就是 be humbled。", "use": "Accept help without being humbled by it.", "useZh": "接受幫助，但不必因此覺得矮人一截。", "why": "受人恩惠的兩種失態：覺得欠、或裝沒事。這句教的是中間那條窄路。", "zhw": "矮人一截"}], "start": 202.458, "end": 209.458, "ew": [["and", 0.1, 0.3], ["from", 0.312, 0.5], ["him", 0.512, 0.662], ["I", 0.675, 0.75], ["learned", 0.762, 1.05], ["how", 1.062, 1.225], ["to", 1.238, 1.35], ["receive", 1.363, 1.762], ["from", 1.775, 1.95], ["friends", 1.962, 2.312], ["what", 2.325, 2.513], ["are", 2.525, 2.587], ["esteemed", 2.6, 3.013], ["favours", 3.025, 3.5], ["without", 3.725, 4.025], ["being", 4.037, 4.263], ["either", 4.275, 4.513], ["humbled", 4.525, 4.925], ["by", 4.938, 5.062], ["them", 5.075, 5.25], ["or", 5.263, 5.362], ["letting", 5.375, 5.763], ["them", 5.775, 5.9], ["pass", 5.912, 6.25], ["unnoticed", 6.263, 7.0]]}]}]}, "mix": {"audio": "ch01-mix.m4a", "duration": 455.45, "paras": [{"sents": [{"en": "From my grandfather Verus I learned good morals and the government of my temper.", "zh": "從我祖父維魯斯身上，我學到好的品德，還有怎麼管好自己的脾氣。", "notes": [{"w": "the government of my temper", "m": "管好自己的脾氣", "kk": "/ˋtɛmpɚ/", "pos": "片語", "def": "government 在這裡是古典用法，指「約束、控制」，不是政府；temper 是脾氣、性子。整個片語字面是「對脾氣的治理」。", "use": "Meditation helps with the government of my temper.", "useZh": "靜坐幫助我管好自己的脾氣。", "why": "把管脾氣說成一門「治理」，是羅馬人的莊重講法——脾氣不是壓下去，是治理好。", "zhw": "管好"}], "start": 0.0, "zhStart": 5.22, "end": 11.007, "ew": [["From", 0.1, 0.338], ["my", 0.35, 0.5], ["grandfather", 0.512, 1.15], ["Verus", 1.163, 1.587], ["I", 1.6, 1.688], ["learned", 1.7, 2.025], ["good", 2.038, 2.2], ["morals", 2.212, 2.638], ["and", 2.65, 2.75], ["the", 2.763, 2.837], ["government", 2.85, 3.263], ["of", 3.275, 3.362], ["my", 3.375, 3.538], ["temper", 3.55, 4.05]], "zw": [["從", 0.1, 0.312], ["我", 0.325, 0.463], ["祖父", 0.5, 0.825], ["維魯", 0.85, 1.188], ["斯", 1.188, 1.35], ["身上", 1.375, 1.9], ["我", 2.175, 2.288], ["學到", 2.312, 2.638], ["好的", 2.663, 2.938], ["品德", 2.987, 3.487], ["還有", 3.812, 4.075], ["怎麼", 4.138, 4.375], ["管", 4.438, 4.588], ["好", 4.612, 4.787], ["自己的", 4.838, 5.237], ["脾氣", 5.275, 5.787]]}]}, {"sents": [{"en": "From the reputation and remembrance of my father, modesty and a manly character.", "zh": "從我父親留下的名聲、還有大家對他的記憶裡，我學到謙遜，也學到一個男子漢該有的樣子。", "notes": [{"w": "remembrance", "m": "眾人的追憶", "kk": "/rɪˋmɛmbrəns/", "pos": "名詞", "def": "指留在別人心中的記憶與懷念，比 memory 正式，常用在對逝者的追思。", "use": "The park was built in remembrance of the founder.", "useZh": "這座公園是為了紀念創辦人而建的。", "why": "父親早逝，作者是從別人「對他的追憶」認識父親的——一個字就把這層距離講出來。", "zhw": "記憶"}, {"w": "modesty", "m": "謙遜", "kk": "/ˋmɑdəstɪ/", "pos": "名詞", "def": "不誇耀自己、不搶功勞的品格；形容詞是 modest，也可指衣著或用度的樸素。", "use": "Her modesty kept her from mentioning the award.", "useZh": "她太謙虛了，得獎的事提都沒提。", "why": "羅馬人眼中的男子氣概不是張揚，是收斂——所以謙遜和男子漢擺在同一句。", "zhw": "謙遜"}], "start": 12.564, "zhStart": 18.264, "end": 25.989, "ew": [["From", 0.1, 0.362], ["the", 0.375, 0.45], ["reputation", 0.463, 1.163], ["and", 1.175, 1.312], ["remembrance", 1.325, 1.837], ["of", 1.85, 1.95], ["my", 1.962, 2.15], ["father", 2.163, 2.625], ["modesty", 2.837, 3.288], ["and", 3.375, 3.487], ["a", 3.5, 3.538], ["manly", 3.55, 3.925], ["character", 3.938, 4.525]], "zw": [["從", 0.1, 0.312], ["我", 0.325, 0.475], ["父親", 0.487, 0.8], ["留下的", 0.825, 1.288], ["名聲", 1.3, 1.8], ["還有", 2.15, 2.4], ["大家", 2.462, 2.775], ["對", 2.825, 2.913], ["他的", 2.938, 3.225], ["記憶", 3.25, 3.513], ["裡", 3.55, 3.862], ["我", 4.138, 4.25], ["學到", 4.275, 4.6], ["謙遜", 4.612, 5.1], ["也", 5.4, 5.525], ["學到", 5.562, 5.925], ["一個", 5.938, 6.15], ["男子漢", 6.162, 6.725], ["該", 6.775, 6.925], ["有的", 6.938, 7.162], ["樣子", 7.2, 7.725]]}]}, {"sents": [{"en": "From my mother, piety and beneficence, and abstinence, not only from evil deeds, but even from evil thoughts;", "zh": "從我母親身上，我學到虔敬跟樂善好施。她讓我懂得節制——不只是不做壞事，連壞念頭都不要有。", "notes": [{"w": "piety", "m": "虔敬", "kk": "/ˋpaɪətɪ/", "pos": "名詞", "def": "對神明、長輩發自內心的敬意與盡責；宗教味比 respect 重，形容詞是 pious。", "use": "She lights incense every morning out of piety.", "useZh": "她每天早上上香，是出於虔敬。", "why": "羅馬人把對神和對家的盡責看成同一種德性，這個字兩層都包。", "zhw": "虔敬"}, {"w": "abstinence", "m": "節制、戒絕", "kk": "/ˋæbstənəns/", "pos": "名詞", "def": "主動不去碰某樣東西的自制，對象常是酒、慾望、享樂；動詞是 abstain from。", "use": "The doctor advised abstinence from alcohol.", "useZh": "醫生建議他戒酒。", "why": "重點在後半句：連壞念頭都要戒——節制做到念頭那一層，才是這句的力道。", "zhw": "節制"}], "start": 27.504, "zhStart": 35.532, "end": 44.932, "ew": [["From", 0.1, 0.388], ["my", 0.4, 0.55], ["mother", 0.562, 0.925], ["piety", 1.163, 1.625], ["and", 1.712, 1.837], ["beneficence", 1.85, 2.562], ["and", 2.763, 2.888], ["abstinence", 2.9, 3.587], ["not", 3.812, 4.037], ["only", 4.05, 4.287], ["from", 4.3, 4.5], ["evil", 4.513, 4.775], ["deeds", 4.787, 5.2], ["but", 5.375, 5.525], ["even", 5.537, 5.775], ["from", 5.787, 5.963], ["evil", 5.975, 6.25], ["thou 8, 3.788], ["花", 3.812, 4.162]]}]}, {"sents": [{"en": "From my governor, to be neither of the green nor of the blue party at the games in the Circus, nor a partisan either of the Parmularius or the Scutarius at the gladiators' fights;", "zh": "從帶我長大的師傅身上，我學到在賽場看比賽不要選邊站——不當綠隊的人，也不當藍隊的人；看角鬥士打鬥，也不偏袒小盾派或大盾派。", "notes": [{"w": "partisan", "m": "死忠支持者", "kk": "/ˋpɑrtəzn/", "pos": "名詞", "def": "狂熱偏袒某一方的人，帶「不問是非、先站隊」的貶義；現代講政治對立常用 partisan politics。", "use": "Try not to be a partisan before hearing both sides.", "useZh": "兩邊都還沒聽完，先別急著當某一方的死忠。", "why": "兩千年前的賽車和角鬥就有「粉絲站隊文化」，作者從小被教不要捲進去。", "zhw": "偏袒"}], "start": 83.064, "zhStart": 93.948, "end": 105.573, "ew": [["From", 0.1, 0.35], ["my", 0.362, 0.5], ["governor", 0.512, 0.925], ["to", 1.125, 1.212], ["be", 1.225, 1.35], ["neither", 1.363, 1.725], ["of", 1.738, 1.825], ["the", 1.837, 1.938], ["green", 1.95, 2.288], ["nor", 2.3, 2.525], ["of", 2.538, 2.612], ["the", 2.625, 2.725], ["blue", 2.737, 3.025], ["party", 3.038, 3.475], ["at", 3.487, 3.55], ["the", 3.562, 3.65], ["games", 3.663, 4.013], ["in", 4.025, 4.112], ["the", 4.125, 4.2], ["Circus", 4.213, 4.737], ["nor", 4.963, 5.213], ["a", 5.225, 5.287], ["partisan", 5.3, 5.925], ["either", 5.938, 6.237], ["of", 6.25, 6.338], ["the", 6.35, 6.425], ["Parmularius", 6.438, 7.287], ["or", 7.3, 7.388], ["the", 7.4, 7.5], ["Scutarius", 7.513, 8.213], ["at", 8.225, 8.312], ["the", 8.325, 8.412], ["gladiators'", 8.425, 9.1], ["fights", 9.113, 9.7]], "zw": [["從", 0.1, 0.338], ["帶", 0.375, 0.525], ["我", 0.55, 0.662], ["長大的", 0.7, 1.15], ["師傅", 1.163, 1.512], ["身上", 1.525, 2.062], ["我", 2.35, 2.45], ["學到", 2.475, 2.837], ["在", 2.837, 2.975], ["賽場", 2.987, 3.337], ["看", 3.4, 3.55], ["比賽", 3.587, 3.938], ["不要", 4.0, 4.237], ["選", 4.25, 4.4], ["邊", 4.425, 4.575], ["站", 4.65, 4.938], ["不當", 5.225, 5.513], ["綠隊的", 5.562, 5.963], ["人", 5.963, 6.263], ["也", 6.575, 6.7], ["不當", 6.75, 7.025], ["藍", 7.025, 7.138], ["隊的", 7.188, 7.45], ["人", 7.45, 7.775], ["看角", 8.137, 8.475], ["鬥士", 8.475, 8.75] ls for fighting, nor to give myself up passionately to such things;", "zh": "他也讓我不去養鬥鵪鶉，不要沉迷在那種東西裡面。", "notes": [{"w": "give myself up to", "m": "沉迷於", "kk": "/ˋpæʃənɪtlɪ/", "pos": "片語", "def": "give oneself up to 是整個人投進去、任由某事吞掉自己；加上 passionately 就是「狂熱地沉迷」。", "use": "He gave himself up to gaming for a whole year.", "useZh": "他整整一年沉迷在電玩裡。", "why": "鬥鵪鶉是當時的賭博娛樂；問題不在鵪鶉，在「整個人陷進去」。", "zhw": "沉迷"}], "start": 160.62, "zhStart": 166.608, "end": 170.946, "ew": [["and", 0.1, 0.3], ["not", 0.312, 0.475], ["to", 0.487, 0.575], ["breed", 0.588, 0.887], ["quails", 0.9, 1.337], ["for", 1.35, 1.438], ["fighting", 1.45, 1.913], ["nor", 2.138, 2.337], ["to", 2.35, 2.487], ["give", 2.5, 2.675], ["myself", 2.688, 3.163], ["up", 3.175, 3.325], ["passionately", 3.337, 3.85], ["to", 3.862, 3.975], ["such", 3.987, 4.275], ["things", 4.287, 4.812]], "zw": [["他", 0.1, 0.287], ["也", 0.287, 0.463], ["讓", 0.475, 0.6], ["我", 0.625, 0.75], ["不去", 0.775, 1.05], ["養鬥", 1.062, 1.413], ["鵪鶉", 1.425, 1.938], ["不要", 2.225, 2.487], ["沉迷", 2.525, 2.9], ["在", 2.962, 3.087], ["那", 3.1, 3.25], ["種", 3.288, 3.413], ["東西", 3.475, 3.8], ["裡面", 3.825, 4.338]]}, {"en": "and to endure freedom of speech; and to have become intimate with philosophy;", "zh": "他教我要受得了別人的直言，也讓我開始親近哲學。", "notes": [{"w": "endure freedom of speech", "m": "受得了別人直言", "kk": "/ɪnˋdjʊr/", "pos": "片語", "def": "這裡的 freedom of speech 不是現代的「言論自由」，是「別人有話直說」；endure 是你要吞得下去。", "use": "A good leader endures freedom of speech from the team.", "useZh": "好的主管受得了團隊有話直說。", "why": "對未來的皇帝，這是最難的一課：權力越大，越少人敢對你說真話。", "zhw": "直言"}], "start": 172.512, "zhStart": 177.516, "end": 181.816, "ew": [["and", 0.1, 0.263], ["to", 0.275, 0.4], ["endure", 0.412, 0.812], ["freedom", 0.825, 1.238], ["of", 1.25, 1.325], ["speech", 1.337, 1.725], ["and", 1.988, 2.062], ["to", 2.075, 2.15], ["have", 2.163, 2.312], ["become", 2.325, 2.638], ["intimate", 2.65, 3.05], ["with", 3.062, 3.188], ["philosophy", 3.2, 3.825]], "zw": [["他", 0.1, 0.287], ["教", 0.338, 0.475], ["我", 0.475, 自己還有很多要學。", "why": "整卷唯一一句「我被點醒」——別人給他知識，魯斯提庫斯給他自知之明。", "zhw": "意識到"}], "start": 215.652, "zhStart": 221.448, "end": 227.36, "ew": [["From", 0.1, 0.362], ["Rusticus", 0.375, 0.887], ["I", 0.9, 1.025], ["received", 1.038, 1.488], ["the", 1.5, 1.587], ["impression", 1.6, 2.075], ["that", 2.087, 2.212], ["my", 2.225, 2.362], ["character", 2.375, 2.837], ["required", 2.85, 3.35], ["improvement", 3.362, 3.925], ["and", 3.938, 4.013], ["discipline", 4.025, 4.625]], "zw": [["從", 0.1, 0.325], ["魯斯", 0.388, 0.675], ["提", 0.713, 0.875], ["庫斯", 0.925, 1.262], ["身上", 1.288, 1.825], ["我", 2.087, 2.2], ["才", 2.237, 2.425], ["意識到", 2.425, 2.875], ["自己的", 2.913, 3.325], ["品格", 3.375, 3.8], ["還", 3.825, 3.962], ["需要", 3.987, 4.3], ["改進", 4.325, 4.787], ["需要", 5.062, 5.412], ["磨練", 5.425, 5.912]]}, {"en": "and from him I learned not to be led astray to sophistic emulation, nor to writing on speculative matters, nor to delivering little hortatory orations,", "zh": "他讓我不要走偏——不要去跟人比誰的詭辯厲害，不要寫空談玄理的東西，也不要動不動就發表一小段勸世的演講。", "notes": [{"w": "sophistic", "m": "詭辯的", "kk": "/səˋfɪstɪk/", "pos": "形容詞", "def": "聽起來頭頭是道、其實只為贏不為真的論證方式；源自古希臘的詭辯學派（Sophists）。", "use": "His argument sounds clever but is merely sophistic.", "useZh": "他的論點聽起來聰明，其實只是詭辯。", "why": "當時的知識圈流行鬥嘴炫技；魯斯提庫斯教他分清「講贏」和「講對」。", "zhw": "詭辯"}, {"w": "hortatory", "m": "勸誡式的", "kk": "/ˋhɔrtəˏtorɪ/", "pos": "形容詞", "def": "以勸勉、訓話為目的的（言論）；字根同 exhort（力勸）。是個書卷味很重的字。", "use": "The coach's hortatory speech got old fast.", "useZh": "教練那套訓話式的演講很快就讓人膩了。", "why": "「動不動就勸世」是一種表演——真正的修行不需要觀眾，下一句就講到這個。", "zhw": "勸世"}], "start": 228.936, "zhStart": 238.116, "end": 247.329, "ew": [["and", 0.1, 0.263], ["from", 0.275, 0.438], ["him", 0.45, 0.613], ["I", 0.625, 0.713], ["learned", 0.725, 1.0], ["not", 1.012, 1.175], ["to", 1.188, 1.25], ["be", 1.262, 1.363], ["led", 1.375, 1.575], ["astray", 1.587, 1.925], ["to", 1.938, 2.062], ["sophistic", 2.075, 2.575], ["emulation", 2.587, 3.175], ["nor", 3.462, 3.638], ["to", 3.65, 3.788], ["writing", 3.8, 4.188], ["o ied and reconciled, as soon as they have shown a readiness to be reconciled;", "zh": "要是有人用言語冒犯我、或是做了對不起我的事，只要對方願意和解，我就該很容易消氣、跟人和好。", "notes": [{"w": "pacified", "m": "消氣、被平息", "kk": "/ˋpæsəˏfaɪd/", "pos": "動詞", "def": "pacify 是使平靜、平息怒氣；字根 pac- 就是 peace，安撫嬰兒的奶嘴叫 pacifier。", "use": "A sincere apology quickly pacified her.", "useZh": "一句真誠的道歉很快讓她消了氣。", "why": "注意順序：對方先伸手，你就要接——氣可以有，但不能捨不得放。", "zhw": "消氣"}, {"w": "reconciled", "m": "和好", "kk": "/ˋrɛkənˏsaɪld/", "pos": "動詞", "def": "reconcile 是修復關係、重歸於好；也用在「調和」兩個矛盾的事物，會計對帳也叫 reconcile。", "use": "The brothers reconciled after years of silence.", "useZh": "兄弟倆冷戰多年後和好了。", "why": "一句話裡出現兩次 reconciled——條件和結果都是它，和好這件事沒有討價還價。", "zhw": "和好"}], "start": 300.66, "zhStart": 311.472, "end": 320.21, "ew": [["and", 0.1, 0.3], ["with", 0.312, 0.45], ["respect", 0.463, 0.825], ["to", 0.838, 0.9], ["those", 0.912, 1.175], ["who", 1.188, 1.3], ["have", 1.312, 1.45], ["offended", 1.462, 1.85], ["me", 1.863, 1.975], ["by", 1.988, 2.163], ["words", 2.175, 2.688], ["or", 2.925, 3.05], ["done", 3.062, 3.312], ["me", 3.325, 3.413], ["wrong", 3.425, 3.775], ["to", 3.95, 4.025], ["be", 4.037, 4.162], ["easily", 4.175, 4.612], ["disposed", 4.625, 5.125], ["to", 5.138, 5.2], ["be", 5.213, 5.325], ["pacified", 5.338, 5.963], ["and", 5.975, 6.1], ["reconciled", 6.112, 6.825], ["as", 7.037, 7.162], ["soon", 7.175, 7.425], ["as", 7.438, 7.537], ["they", 7.55, 7.65], ["have", 7.662, 7.8], ["shown", 7.812, 8.088], ["a", 8.1, 8.137], ["readiness", 8.15, 8.512], ["to", 8.525, 8.625], ["be", 8.637, 8.738], ["reconciled", 8.75, 9.65]], "zw": [["要是", 0.1, 0.438], ["有人", 0.438, 0.762], ["用", 0.838, 0.975], ["言語", 1.012, 1.288], ["冒犯", 1.363, 1.7], ["我", 1.762, 2.062], ["或是", 2.35, 2.638], ["做", 2.65, 2.825], ["了", 2.888, 2.962], ["對不起", 3.025, 3.438], ["我的", 3.475, 3.725], ["事", 3.75, 4.088], ["只要", 4.412, 4.675], ["對方", 4.725, 5.0], ["願意", 5.037, 5.287], ["和解", 5.338, 5.875], ["我", 6.15, 6.25], ["就", 6.3, 6.4], ["該", 6.45, 6.6], ["很", 6.625, 6.763], ["容易", 6  5.888], ["著", 5.975, 6.1], ["點頭", 6.1, 6.438], ["同意", 6.463, 6.938]]}, {"en": "and I am indebted to him for being acquainted with the discourses of Epictetus, which he communicated to me out of his own collection.", "zh": "我還要感謝他——是他把自己收藏的愛比克泰德講稿拿給我看，我才認識這些內容。", "notes": [{"w": "indebted", "m": "感激、受惠於", "kk": "/ɪnˋdɛtɪd/", "pos": "形容詞", "def": "字面是「欠債的」（debt），引申為受了恩惠、心懷感激；be indebted to sb for sth 是固定句型。", "use": "I am indebted to my first editor for everything.", "useZh": "我對第一位編輯感激不盡。", "why": "一本改變他一生的書，是老師從私人收藏裡拿出來的——這筆「債」他記了一輩子。", "zhw": "感謝"}, {"w": "discourses", "m": "講稿、論說", "kk": "/ˋdɪskorsɪz/", "pos": "名詞", "def": "有系統的談話或論述紀錄；愛比克泰德的《語錄》英譯就叫 Discourses——是學生聽課的筆記。", "use": "His discourses were collected by his students.", "useZh": "他的講稿是學生們整理下來的。", "why": "本書架上那本《愛比克泰德語錄》，就是這裡講的這份講稿——兩本書在這句相遇。", "zhw": "講稿"}], "start": 339.108, "zhStart": 346.704, "end": 353.266, "ew": [["and", 0.1, 0.3], ["I", 0.312, 0.425], ["am", 0.438, 0.537], ["indebted", 0.55, 0.938], ["to", 0.95, 1.012], ["him", 1.025, 1.212], ["for", 1.225, 1.325], ["being", 1.337, 1.587], ["acquainted", 1.6, 2.1], ["with", 2.112, 2.225], ["the", 2.237, 2.312], ["discourses", 2.325, 2.888], ["of", 2.9, 2.975], ["Epictetus", 2.987, 3.712], ["which", 3.925, 4.088], ["he", 4.1, 4.2], ["communicated", 4.213, 4.95], ["to", 4.963, 5.037], ["me", 5.05, 5.188], ["out", 5.2, 5.375], ["of", 5.388, 5.463], ["his", 5.475, 5.625], ["own", 5.638, 5.812], ["collection", 5.825, 6.425]], "zw": [["我", 0.1, 0.2], ["還", 0.25, 0.412], ["要", 0.412, 0.537], ["感謝", 0.55, 0.887], ["他", 0.925, 1.25], ["是", 1.475, 1.625], ["他", 1.637, 1.837], ["把", 1.85, 2.013], ["自己", 2.05, 2.275], ["收藏的", 2.312, 2.788], ["愛", 2.812, 2.987], ["比克", 3.038, 3.35], ["泰", 3.375, 3.525], ["德", 3.575, 3.688], ["講稿", 3.7, 4.025], ["拿給", 4.037, 4.325], ["我", 4.35, 4.487], ["看", 4.55, 4.838], ["我", 5.15, 5.263], ["才", 5.3, 5.487], ["認識", 5.487, 5.75], ["這些", 5.787, 6.1], ["內容", 6.125, 6.562]]}]}, {"sents": [{"en": "From Apollonius I learned freedom of will and undeviating steadiness of purpose;", "zh": "從阿波羅尼烏斯身上，我學到意志的自由，還有立定目標之後就毫不動搖的堅定。", "notes": [{"w": "undeviating", "m": "毫不偏離的", "kk": "/ʌnˋdivɪˏetɪŋ/", "pos": "形容詞", "def": "deviate 是偏離路線，undeviating 就是從不偏離、筆直到底的。", "use": "She pursued the goal with undeviating focus.", "useZh": "她毫不動搖地朝目標前進。", "why": "不是「很少偏離」，是「不偏離」——un- 一個字首把程度鎖死。", "zhw": "毫不動搖"}], "start": 354.816, "zhStart": 360.3, "end": 367.112, "ew": [["From", 0.1, 0.375], ["Apollonius", 0.388, 1.012], ["I", 1.025, 1.15], ["learned", 1.163, 1.512], ["freedom", 1.525, 1.913], ["of", 1.925, 1.988], ["will", 2.0, 2.225], ["and", 2.237, 2.325], ["undeviating", 2.337, 3.1], ["steadiness", 3.112, 3.538], ["of", 3.55, 3.65], ["purpose", 3.663, 4.3]], "zw": [["從", 0.1, 0.35], ["阿波羅尼", 0.362, 1.025], ["烏斯", 1.038, 1.363], ["身上", 1.387, 1.913], ["我", 2.188, 2.312], ["學到", 2.337, 2.663], ["意志的", 2.675, 3.1], ["自由", 3.138, 3.65], ["還有", 3.987, 4.25], ["立定", 4.275, 4.513], ["目標", 4.55, 4.888], ["之", 4.938, 5.013], ["後", 5.088, 5.35], ["就", 5.438, 5.55], ["毫不", 5.6, 5.888], ["動搖的", 5.925, 6.338], ["堅定", 6.375, 6.812]]}, {"en": "and to look to nothing else, not even for a moment, except to reason;", "zh": "他讓我懂得，除了理性以外，什麼都不該去看重，連一刻都不行。", "notes": [{"w": "look to", "m": "看重、指望", "kk": "/lʊk/", "pos": "片語", "def": "把目光放在某處，引申為依靠、以…為依歸；look to reason 就是凡事回到理性來判斷。", "use": "In a crisis, look to the facts first.", "useZh": "遇到危機，先回到事實。", "why": "「連一刻都不行」——斯多噶的理性不是原則，是每一秒的操作方式。", "zhw": "看重"}], "start": 368.7, "zhStart": 373.8, "end": 379.475, "ew": [["and", 0.1, 0.275], ["to", 0.287, 0.388], ["look", 0.4, 0.55], ["to", 0.562, 0.637], ["nothing", 0.65, 1.062], ["else", 1.075, 1.425], ["not", 1.625, 1.85], ["even", 1.863, 2.087], ["for", 2.1, 2.237], ["a", 2.25, 2.312], ["moment", 2.325, 2.763], ["except", 2.925, 3.325], ["to", 3.337, 3.413], ["reason", 3.425, 3.925]], "zw": [["他", 0.1, 0.325], ["讓", 0.325, 0.425], ["我", 0.45, 0.588], ["懂得", 0.625, 1.137], ["除了", 1.413, 1.738], ["理性", 1.75, 2.013], ["以外", 2.05, 2.538], ["什麼", 2.825, 3.15], ["都", 3.175, 3.288], ["不該", 3.288, 3.575], ["去", 3.587, 3.712], ["看重", 3.775, 4.287], ["連", 4.612, 4.775], ["一刻", 4.775, 5.05], ["都", 5.05, 5.175], ["不行", 5.188, 5.675]]}, {"en": "and to be always the same, in sharp pains, on the occasion of the loss of a child, and in long illness;", "zh": "他教我不管碰到什麼處境都要保持一樣——劇烈的疼痛、失去孩子的時候，還是久病纏身的日子。", "notes": [{"w": "on the occasion of", "m": "在…的時候", "kk": "/əˋkeʒən/", "pos": "片語", "def": "正式的時間片語，指某個特定事件發生之際；比 when 更莊重，常見於典禮或重大事件。", "use": "He stayed calm on the occasion of the storm.", "useZh": "暴風雨來的時候，他保持鎮定。", "why": "喪子這種事用最平靜的片語帶過——文字本身就在示範「保持一樣」。", "zhw": "的時候"}], "start": 381.048, "zhStart": 387.852, "end": 396.065, "ew": [["and", 0.1, 0.275], ["to", 0.287, 0.362], ["be", 0.375, 0.487], ["always", 0.5, 0.863], ["the", 0.875, 0.975], ["same", 0.988, 1.337], ["in", 1.525, 1.625], ["sharp", 1.637, 1.962], ["pains", 1.975, 2.413], ["on", 2.625, 2.763], ["the", 2.775, 2.862], ["occasion", 2.875, 3.275], ["of", 3.288, 3.35], ["the", 3.362, 3.438], ["loss", 3.45, 3.688], ["of", 3.7, 3.775], ["a", 3.788, 3.85], ["child", 3.862, 4.362], ["and", 4.575, 4.7], ["in", 4.713, 4.838], ["long", 4.85, 5.112], ["illness", 5.125, 5.638]], "zw": [["他", 0.1, 0.287], ["教", 0.338, 0.475], ["我", 0.475, 0.613], ["不管", 0.625, 0.912], ["碰到", 0.95, 1.3], ["什麼", 1.312, 1.613], ["處境", 1.65, 2.025], ["都", 2.163, 2.288], ["要", 2.3, 2.45], ["保持", 2.462, 2.75], ["一樣", 2.763, 3.288], ["劇烈的", 3.612, 4.05], ["疼痛", 4.088, 4.575], ["失去", 4.838, 5.188], ["孩子的", 5.237, 5.713], ["時候", 5.725, 6.275], ["還是", 6.537, 6.8], ["久病", 6.838, 7.15], ["纏身的", 7.213, 7.7], ["日子", 7.713, 8.213]]}, {"en": "and to see clearly in a living example that the same man can be both most resolute and yielding, and not peevish in giving his instruction;", "zh": "我從一個活生生的例子清楚看到，同一個人可以既非常剛毅、又願意退讓，教導別人的時候也不會不耐煩。", "notes": [{"w": "resolute", "m": "剛毅、堅決", "kk": "/ˋrɛzəˏlut/", "pos": "形容詞", "def": "下了決心就不動搖的；名詞是 resolution——新年新希望的「決心」就是這個字。", "use": "She was resolute in refusing the shortcut.", "useZh": "她堅決不走捷徑。", "why": "剛毅（resolute）與退讓（yielding）是反義詞，卻同時放在一個人身上——這句的重點就是這個矛盾。", "zhw": "剛毅"}, {"w": "peevish", "m": "易怒、不耐煩的", "kk": "/ˋpivɪʃ/", "pos": "形容詞", "def": "為小事發脾氣、煩躁易怒的；形容那種「一點就炸」的壞脾氣。", "use": "Lack of sleep makes me peevish.", "useZh": "睡不夠我就容易不耐煩。", "why": "教人最難的不是懂，是不煩——阿波羅尼烏斯連這個都做到了。", "zhw": "不耐煩"}], "start": 397.596, "zhStart": 405.6, "end": 414.512, "ew": [["and", 0.1, 0.287], ["to", 0.3, 0.4], ["see", 0.412, 0.625], ["clearly", 0.637, 1.025], ["in", 1.038, 1.125], ["a", 1.137, 1.175], ["living", 1.188, 1.475], ["example", 1.488, 1.95], ["that", 1.962, 2.062], ["the", 2.075, 2.15], ["same", 2.163, 2.425], ["man", 2.438, 2.675], ["can", 2.688, 2.825], ["be", 2.837, 2.938], ["both", 2.95, 3.25], ["most", 3.263, 3.525], ["resolute", 3.538, 3.987], ["and", 4.0, 4.088], ["yielding", 4.1, 4.55], ["and", 4.838, 4.95], ["not", 4.963, 5.162], ["peevish", 5.175, 5.562], ["in", 5.575, 5.675], ["giving", 5.688, 6.0], ["his", 6.013, 6.138], ["instruction", 6.15, 6.825]], "zw": [["我", 0.1, 0.225], ["從", 0.25, 0.425], ["一個", 0.45, 0.65], ["活生生的", 0.688, 1.363], ["例子", 1.375, 1.663], ["清楚", 1.675, 2.05], ["看到", 2.1, 2.6], ["同一", 2.938, 3.163], ["個人", 3.212, 3.513], ["可以", 3.625, 3.788], ["既", 3.85, 3.987], ["非常", 4.013, 4.35], ["剛", 4.425, 4.575], ["毅", 4.638, 4.912], ["又", 5.213, 5.35], ["願意", 5.375, 5.6], ["退讓", 5.662, 6.138], ["教導", 6.438, 6.75], ["別人的", 6.8, 7.225], ["時候", 7.237, 7.75], ["也", 7.812, 7.963], ["不會", 7.987, 8.275], ["不耐煩", 8.287, 8.912]]}, {"en": "and to have had before my eyes a man who clearly considered his experience and his skill in expounding philosophical principles as the smallest of his merits;", "zh": "我親眼見到一個人，他明明很有經驗、很擅長講解哲學道理，卻把這些看成自己最不值一提的長處。", "notes": [{"w": "expounding", "m": "講解、闡述", "kk": "/ɪkˋspaʊndɪŋ/", "pos": "動詞", "def": "expound 是把道理有系統地講清楚；比 explain 更正式，對象通常是學說、理論、經典。", "use": "He spent an hour expounding his theory.", "useZh": "他花了一小時闡述他的理論。", "why": "最會講的人最不把「會講」當回事——因為斯多噶的重點是活出來，不是講 /* 註解底線：在（已跳脫的）文字上標記難字 */
function markN(text, notes) {
  let h = esc(text);
  (notes || []).slice().sort((a, b) => b.w.length - a.w.length).forEach(n => {
    const w = esc(n.w).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    h = h.replace(new RegExp('(?<![\\w>])(' + w + ')(?![\\w<])', 'i'),
      `<i class="n" data-m="${esc(n.m)}" data-w="${esc(n.w)}" data-e="${esc(n.e || n.w)}">$1</i>`);
  });
  return h;
}
/* 依標點切小句，一小句一個反黑單位——比逐字跳動貼近人讀書的節奏 */
function tile(text, words, notes) {
  if (!words || !words.length) return markN(text, notes);
  const pos = []; let p = 0;
  words.forEach(([w, a, b]) => {
    const at = text.indexOf(w, p);
    if (at < 0) return;
    pos.push({ at, a, b }); p = at + w.length;
  });
  if (!pos.length) return markN(text, notes);
  const cuts = []; const re = /[，、。；：！？,;:.!?—]+/g; let m;
  while ((m = re.exec(text))) cuts.push(m.index + m[0].length);
  if (!cuts.length || cuts[cuts.length - 1] < text.length) cuts.push(text.length);
  let h = '', from = 0;
  cuts.forEach(c => {
    const seg = text.slice(from, c);
    const ws = pos.filter(x => x.at >= from && x.at < c);
    h += ws.length
      ? `<em data-a="${ws[0].a}" data-b="${ws[ws.length - 1].b}">${markN(seg, notes)}</em>`
      : markN(seg, notes);
    from = c;
  });
  return h;
}

/* 生字：整章的註解收在一起，同一個字合併並記次數 */
function vocab() {
  const d = CH.tracks[mode], map = new Map();
  let si = 0;
  d.paras.forEach(p => p.sents.forEach(s => {
    (s.notes || []).forEach(n => {
      const k = n.w.toLowerCase();
      if (!map.has(k)) map.set(k, { ...n, occ: [], count: 0 });
      map.get(k).count++;
      map.get(k).occ.push({ si, s });
    });
    si++;
  }));
  return [...map.values()];
}

function renderText() {
  const d = CH.tracks[mode];
  $('hint').innerHTML = '英文逐句朗讀，中譯在下方對照。點任一句跳過去聽；<b>虛線字</b>點了看解釋。';
  const body = $('body'); body.innerHTML = ''; els = []; flat = []; cur = -1;
  d.paras.forEach(p => {
    const wrap = document.createElement('div'); wrap.className = 'pt';
    p.sents.forEach(s => {
      const box = document.createElement('div'); box.className = 's';
      const zhNotes = (s.notes || []).filter(n => n.zhw)
        .map(n => ({ w: n.zhw, m: n.w + '　' + (n.m || ''), e: n.w }));
      box.innerHTML = `<span class="en">${tile(s.en, s.ew, s.notes)}</span>` +
                      `<span class="zh">${tile(s.zh, s.zw, zhNotes)}</span>`;
      box.querySelector('.en').onclick = e => {
        if (e.target.closest('i.n')) return;
        au.currentTime = s.start + .02; au.play();
      };
      wrap.appendChild(box); els.push(box); flat.push({ ...s, pt: wrap });
    });
    body.appendChild(wrap);
  });
}

    const occHtml = v.occ.map(o =>
      `<div class="vc" data-si="${o.si}">` +
      esc(o.s.en).replace(new RegExp('(' + rx(v.w) + ')', 'i'), '<mark>$1</mark>') +
      `</div>`).join('');
    row.innerHTML =
      `<div class="vhead"><span class="vw">${esc(v.w)}</span>` +
      `<button class="spk" data-p="n" title="唸這個字">${SPK}</button>` +
      `<button class="spk slow" data-p="s" title="放慢唸">慢</button>` +
      (v.kk ? `<span class="kk">${esc(v.kk)}</span>` : '') +
      (v.pos ? `<span class="pos">${esc(v.pos)}</span>` : '') +
      (v.count > 1 ? `<span class="vn">出現 ${v.count} 次</span>` : '') + `</div>` +
      `<p class="vm">${esc(v.m)}</p>` +
      (v.def ? `<p class="vdef">${esc(v.def)}</p>` : '') +
      (v.use ? `<div class="vuse"><span class="e">${esc(v.use)}</span>` +
               `<span class="z">${esc(v.useZh || '')}</span></div>` : '') +
      occHtml;
    const F = (CH.vocabFiles || {})[v.w.toLowerCase()] || {};
    row.querySelectorAll('.spk').forEach(b =>
      b.onclick = e => { e.stopPropagation(); playClip(F[b.dataset.p], b); });
    const use = row.querySelector('.vuse');
    if (use) use.onclick = e => playClip(F.u, e.currentTarget);
    row.querySelectorAll('.vc').forEach(el =>
      el.onclick = () => jumpTo(+el.dataset.si));
    list.appendChild(row);
  });
  body.appendChild(list);
}

let stopAt = null, track = 'chapter';   // chapter | vocab | study
let lit = null;

function useTrack(name, audio) {
  if (track === name) return;
  track = name; stopAt = null;
  au.src = audio;
}

/* 剛換 src 時 metadata 還沒到，直接設 currentTime 會被丟掉 */
function seekPlay(t) {
  const go = () => { au.currentTime = t; au.play().catch(() => {}); };
  if (au.readyState >= 1) go();
  else au.addEventListener('loadedmetadata', go, { once: true });
}

function playStudy(key) {
  if (!CH.studyAudio || !CH.studyBlocks) return;
  const b = CH.studyBlocks.find(x => x.k === key);
  if (!b) return;
  useTrack('study', CH.studyAudio);
  stopAt = null;                       // 從這塊往下一直播
  seekPlay(b.start);
}

function markLit(el) {
  if (lit === el) return;
  if (lit) lit.classList.remove('lit');
  lit = el;
  if (!el) return;
  el.classList.add('lit');
  if (Date.now() - scrolled > 2500) {
    const r = el.getBoundingClientRect();
    if (r.top < 130 || r.bottom > innerHeight - 190)
      el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }
}

/* 生字用獨立音檔，另開一個 audio 播放，完全不 seek —— seek 在 iOS 上不可靠 */
let clipAu = null;
function playClip(src, btn) {
  if (!src) return;
  au.pause();
  if (clipAu) { clipAu.pause(); clipAu.src = ''; }
  document.querySelectorAll('.spk.on,.vuse.on').forEach(b => b.classList.remove('on'));
  markLit(btn.closest('.v'));
  btn.classList.add('on');
  clipAu = new Audio(src);
  clipAu.playbackRate = 1;
  clipAu.onended = () => btn.classList.remove('on');
  clipAu.play().catch(() => btn.classList.remove('on'));
}

/* 課文裡的虛線字 -> 生字頁那張卡 */
function jumpToVocab(w) {
  view = 'vocab';
  render();
  requestAnimationFrame(() => {
    const el = document.querySelector(`.v[data-w="${w.toLowerCase().replace(/"/g, '')}"]`);
    if (el) { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); markLit(el); }
  });
}

/* 生字出處 -> 跳回課文該句（原文與中譯都在），並從那句開始播 */
function jumpTo(si) {
  view = 'text';
  render();
  backToChapter();
  const s = flat[si];
  if (!s) return;
  seekPlay(s.start + .02);
  requestAnimationFrame(() => {
    if (els[si]) els[si].scrollIntoView({ block: 'center', behavior: 'smooth' });
  });
}

function backToChapter() {
  if (track === 'chapter') return;
  track = 'chapter'; stopAt = null; markLit(null);
  au.src = CH.tracks[mode].audio;
}

function renderStudy() {
  $('hint').innerHTML = '一句一句拆。每個詞除了字義，還說明它<b>在這一句裡</b>起什麼作用。'
    + '按播放會整段唸下去（英文、中譯、每個詞、總結），唸到哪裡亮到哪裡；點任一塊從那裡開始。';
  const d = CH.tracks[mode], body = $('body');
  body.innerHTML = ''; els = []; flat = []; cur = -1;
  d.paras.forEach((p, pi) => p.sents.forEach((s, si) => {
    if (!(s.notes || []).length) return;
    const key = `${pi}-${si}`;
    const box = document.createElement('div'); box.className = 'st';
    box.innerHTML =
      `<p class="sten" data-k="${key}/en">${esc(s.en)}</p>` +
      `<p class="stzh" data-k="${key}/zh">${esc(s.zh)}</p>` +
      s.notes.map((n, ni) =>
        `<div class="stn"><div class="stnh">` +
        `<span class="stw" data-k="${key}/n${ni}/w">${esc(n.w)}</span>` +
        `<span class="stm" data-k="${key}/n${ni}/m">${esc(n.m || '')}</span></div>` +
        `<p class="stwhy" data-k="${key}/n${ni}/why">${esc(n.why || n.def || '')}</p></div>`).join('');
    box.querySelectorAll('[data-k]').forEach(el =>
      el.onclick = e => { e.stopPropagation(); playStudy(el.dataset.k); });
    box.querySelectorAll('[data-k]').forEach(el => el.style.cursor = 'pointer');
    body.appendChild(box);
  }));
  const sm = CH.summary || {};
  if ((sm.points || []).length) {
    const box = document.createElement('div'); box.className = 'sum';
    box.innerHTML = '<h2>這段在說什麼</h2><ul>' +
      sm.points.map((p, i) => `<li data-k="sum/${i}">${esc(p)}</li>`).join('') + '</ul>' +
      (sm.take ? `<p class="take" data-k="sum/take">${esc(sm.take)}</p>` : '');
    box.querySelectorAll('[data-k]').forEach(el =>
      el.onclick = () => playStudy(el.dataset.k));
    body.appendChild(box);
  }
}

function render() {
  if (CH.title) $('title').textContent = CH.title;
  const d = CH.tracks[mode];
  $('track').textContent = mode === 'mix' ? '英中交替' : '只聽英文';
  $('kick').textContent = '第 ' + CH.n + ' 章・中英對照・' + Math.round(d.duration / 60)
    + ' 分鐘・' + (mode === 'mix' ? '英中交替' : '只有英文');
  $('vn').textContent = vocab().length;
  $('tab-text').setAttribute('aria-selected', String(view === 'text'));
  $('tab-study').setAttribute('aria-selected', String(view === 'study'));
  $('tab-vocab').setAttribute('aria-selected', String(view === 'vocab'));
  ({ text: renderText, study: renderStudy, vocab: renderVocab })[view]();
}

function load(keep) {
  const t = keep != null && flat[keep] ? flat[keep].start : null;
  render();
  if (au.src !== new URL(CH.tracks[mode].audio, location).href) au.src = CH.tracks[mode].audio;
  if (t != null) { au.currentTime = t + .02; au.play().catch(() => {}); }
}
const chnav = $('chnav');
for (let n = 1; n <= TOTAL; n++) {
  const idx = DATA.findIndex(c => c.n === n);
  const b = document.createElement('button');
  b.textContent = '第 ' + n + ' 章';
  if (idx >= 0) b.onclick = () => loadChapter(idx);
  else { b.disabled = true; b.title = '對照版尚未產出'; }
  chnav.appendChild(b);
}
function paintNav() {
  [...chnav.children].forEach((b, k) => {
    const d = DATA.find(c => c.n === k + 1);
    b.setAttribute('aria-current', String(!!d && d === CH));
    b.classList.toggle('done', !!(d && localStorage.getItem('bi-done-' + d.n)));
  });
}
function loadChapter(idx) {
  CH = DATA[idx];
  localStorage.setItem('bi-ch', String(idx));
  if (clipAu) clipAu.pause();
  track = 'chapter'; stopAt = null;
  if (nowEl) { nowEl.classList.remove('now'); nowEl = null; }
  au.src = CH.tracks[mode].audio;
  render(); paintNav();
  scrollTo({ top: 0, behavior: 'smooth' });
}
au.addEventListener('ended', () => {
  if (track !== 'chapter') return;
  localStorage.setItem('bi-done-' + CH.n, '1');
  paintNav();
});

au.src = CH.tracks[mode].audio;
render();
paintNav();
/* 純中文版的「生字卡」連結會帶 #v=詞 直達那張卡 */
if (/^#v=/.test(location.hash)) {
  const w = decodeURIComponent(location.hash.slice(3));
  view = 'vocab'; render();
  requestAnimationFrame(() => {
    const el = document.querySelector(`.v[data-w="${w.toLowerCase().replace(/"/g, '')}"]`);
    if (el) { el.scrollIntoView({ block: 'center' }); markLit(el); }
  });
}

$('track').onclick = () => {
  const at = cur;
  mode = mode === 'mix' ? 'en' : 'mix';
  localStorage.setItem('bi-track', mode);
  render();
  au.src = CH.tracks[mode].audio;
  if (at >= 0 && flat[at]) seekPlay(flat[at].start + .02);
};
$('tab-text').onclick = () => { view = 'text'; backToChapter(); render(); scrollTo({ top: 0, behavior: 'smooth' }); };
$('tab-study').onclick = () => { view = 'study'; render(); scrollTo({ top: 0, behavior: 'smooth' }); };
$('tab-vocab').onclick = () => { view = 'vocab'; render(); scrollTo({ top: 0, behavior: 'smooth' }); };

const pop = $('pop');
document.addEventListener('click', e => {
  const n = e.target.closest('i.n');
  if (!n) { pop.style.display = 'none'; return; }
  e.stopPropagation();
  const e0 = n.dataset.e || n.dataset.w;
  const F = (CH.vocabFiles || {})[e0.toLowerCase()] || {};
  pop.innerHTML = `<b>${e0}</b>${n.dataset.m}` +
    `<div class="pact">` +
    (F.n ? `<button data-act="play">聽發音</button>` : '') +
    `<button data-act="card">生字卡</button></div>`;
  const pb = pop.querySelector('[data-act="play"]');
  if (pb) pb.onclick = ev => { ev.stopPropagation(); playClip(F.n, pb); };
  pop.querySelector('[data-act="card"]').onclick = ev => {
    ev.stopPropagation(); pop.style.display = 'none'; jumpToVocab(e0);
  };
  pop.style.display = 'block';
  const r = n.getBoundingClientRect(), pr = pop.getBoundingClientRect();
  pop.style.left = Math.max(10, Math.min(innerWidth - pr.width - 10, r.left)) + 'px';
  pop.style.top = (r.bottom + pr.height + 12 > innerHeight ? r.top - pr.height - 8 : r.bottom + 8) + 'px';
});

const fmt = s => (!isFinite(s) || s < 0) ? '0:00'
  : Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
au.addEventListener('timeupdate', () => {
  const t = au.currentTime;
  if (stopAt != null && t >= stopAt) {
    au.pause(); stopAt = null;
    document.querySelectorAll('.spk.on').forEach(b => b.classList.remove('on'));
    return;
  }
  $('time').textContent = fmt(t) + ' / ' + fmt(au.duration);
  $('seek').value = au.duration ? t / au.duration * 1000 : 0;
  if (track === 'study') {
    const b = (CH.studyBlocks || []).find(x => t >= x.start && t < x.end);
    const el = b ? document.querySelector(`[data-k="${b.k}"]`) : null;
    markLit(el);
    if (el && b.w && b.w.length) {
      if (el.dataset.tiled !== '1') {          // 第一次亮到才鋪字，省開場成本
        el.innerHTML = tile(el.textContent, b.w, null);
        el.dataset.tiled = '1';
      }
      const dt = t - b.start;
      let hit = null;
      el.querySelectorAll('em[data-a]').forEach(e => {
        if (dt >= +e.dataset.a && dt < +e.dataset.b) hit = e;
      });
      if (hit !== nowEl) {
        if (nowEl) nowEl.classList.remove('now');
        nowEl = hit;
        if (hit) hit.classList.add('now');
      }
    }
    return;
  }
  if (track !== 'chapter') return;
  if (view !== 'text') return;
  const i = flat.findIndex(s => t >= s.start && t < s.end);
  if (i < 0) return;
  if (i !== cur) {
    if (cur >= 0) { els[cur].classList.remove('on'); flat[cur].pt.classList.remove('on'); }
    els.forEach((el, k) => el.classList.toggle('past', k < i));
    els[i].classList.add('on'); flat[i].pt.classList.add('on'); cur = i;
    if (nowEl) { nowEl.classList.remove('now'); nowEl = null; }
    if (Date.now() - scrolled > 2500) {
      const r = els[i].getBoundingClientRect();
      if (r.top < 130 || r.bottom > innerHeight - 190)
        els[i].scrollIntoView({ block: 'center', behavior: 'smooth' });
    }
  }
  const cs = flat[i];
  if (mode === 'mix' && cs.zhStart != null)
    els[i].classList.toggle('zh-on', t >= cs.zhStart);

  // 小句反黑：英文以句首為零點，中文以中譯起點為零點
  const inZh = mode === 'mix' && cs.zhStart != null && t >= cs.zhStart;
  const base = inZh ? cs.zhStart : cs.start;
  const box = els[i].querySelector(inZh ? '.zh' : '.en');
  if (box) {
    const dt = t - base;
    let hit = null;
    box.querySelectorAll('em[data-a]').forEach(e => {
      if (dt >= +e.dataset.a && dt < +e.dataset.b) hit = e;
    });
    if (hit !== nowEl) {
      if (nowEl) nowEl.classList.remove('now');
      nowEl = hit;
      if (hit) hit.classList.add('now');
    }
  }
});
addEventListener('wheel', () => scrolled = Date.now(), { passive: true });
addEventListener('touchmove', () => scrolled = Date.now(), { passive: true });

const P = 'M3 1.5v13l11-6.5z', U = 'M3.5 1.5h3.2v13H3.5zM9.3 1.5h3.2v13H9.3z';
$('play').onclick = () => {
  if (au.paused && view === 'study' && track !== 'study' && CH.studyBlocks?.length)
    return playStudy(CH.studyBlocks[0].k);
  au.paused ? au.play() : au.pause();
};
au.onplay = () => $('ic').firstElementChild.setAttribute('d', U);
au.onpause = () => $('ic').firstElementChild.setAttribute('d', P);
$('seek').oninput = e => { if (au.duration) au.currentTime = au.duration * e.target.value / 1000; };
$('rate').oninput = e => { au.playbackRate = +e.target.value; $('rv').textContent = (+e.target.value).toFixed(2) + '×'; };
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); $('play').click(); }
  if (e.code === 'ArrowRight') au.currentTime += 10;
  if (e.code === 'ArrowLeft') au.currentTime -= 10;
});
</script>
</body>
</html>
